# Vivijure media stack -- the always-on CPU containers (issue #83).
#
# These run always-on on the operator's container host instead of CF Containers (beta,
# scale-to-zero -> cold-start 504s). CX-8/cf#764: this used to route over Workers VPC; it does not
# any more. The studio Worker reaches each over PUBLIC HTTPS (VIDEO_FINISH_URL / IMAGE_PREP_URL /
# AUDIO_*_URL) plus the MEDIA_FINISH_TOKEN bearer, via the `cloudflared` connector below -> one
# Cloudflare tunnel -> Traefik on the container host -> the docker service name on the `vivijure`
# network. `deploy.sh` (scripts/setup-media-vpc.py, #519) only reuse-or-creates that ONE tunnel and
# writes its connector token to tunnel.env (0600, gitignored), which the cloudflared service reads;
# it does NOT create a VPC service per container and does not mint or print any VPC ids -- see that
# script's own docstring. The containers are stateless and credential-free: the Worker presigns
# short-lived R2 GET/PUT URLs and passes them in the request body, so no R2 binding, no secrets, no
# mounts here.
#
# Deploy:  docker compose -p vivijure-media -f compose.yaml up -d --build
# Health:  curl http://127.0.0.1:8780/health   (video-finish; 8781 prep, 8782 beat-sync, 8783 mix, 8784 master)

name: vivijure-media

x-common: &common
  restart: unless-stopped
  environment:
    PORT: "8000"
    # cf#893 / GHSA-v8g8-gmcm-22gr. On the SHARED anchor deliberately, not per service: the gate
    # went missing from image-prep and audio-master because it was something each container had to
    # remember. Here a new service inherits it by using *common, which is the same reason
    # tests/container-bearer-gate.test.py DERIVES its container list instead of carrying one.
    #
    # Passed through empty rather than made mandatory with `:?`. That is not laxity: the CONTAINER
    # owns this policy and refuses to start with a message naming both this var and the explicit
    # opt-out, and a `:?` here would make compose reject the supported no-auth loopback mode before
    # the container ever got to allow it. One authority, not two disagreeing ones.
    LOCAL_FINISH_TOKEN: "${LOCAL_FINISH_TOKEN:-}"
    LOCAL_FINISH_ALLOW_UNAUTHENTICATED: "${LOCAL_FINISH_ALLOW_UNAUTHENTICATED:-}"
  networks:
    - vivijure

services:
  video-finish:
    <<: *common
    build: ./video-finish
    image: vivijure-cf-video-finish:local
    ports:
      - "127.0.0.1:8780:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  image-prep:
    <<: *common
    build: ./image-prep
    image: vivijure-cf-image-prep:local
    ports:
      - "127.0.0.1:8781:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  audio-beat-sync:
    <<: *common
    build: ./audio-beat-sync
    image: vivijure-cf-audio-beat-sync:local
    ports:
      - "127.0.0.1:8782:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # audio-mix: multi-track mix + sidechain duck + LUFS loudnorm (issue: audio-mux
  # upgrade). A NEW slim service (not folded into audio-beat-sync) so duties stay
  # clean; the service name MUST match its Traefik-routed hostname (audio-mix).
  audio-mix:
    <<: *common
    build: ./audio-mix
    image: vivijure-cf-audio-mix:local
    ports:
      - "127.0.0.1:8783:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # audio-master: film-level mastering of the assembled audio bed -- music upscale
  # (soxr 48k resample + high-shelf "air" lift) + two-pass LUFS loudnorm. A NEW
  # slim service (not folded into audio-mix) so duties stay clean; runs on the
  # fleet CPU (pure ffmpeg DSP, NO GPU). The service name MUST match its Traefik-routed
  # hostname (audio-master).
  audio-master:
    <<: *common
    build: ./audio-master
    image: vivijure-cf-audio-master:local
    ports:
      - "127.0.0.1:8784:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # cloudflared: the tunnel connector for the media-stack tunnel (#519, public HTTPS, not Workers
  # VPC -- see the file header). It joins the `vivijure` network so it can resolve the container
  # service names Traefik routes to. The connector TOKEN is written to tunnel.env (0600, gitignored)
  # by deploy.sh; `cloudflared tunnel run` reads it from TUNNEL_TOKEN. Ingress is configured on the
  # tunnel's public hostnames (Traefik is the routing), not here. If tunnel.env is missing, compose
  # fails closed (run deploy.sh first). Pin the image tag if you prefer.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - tunnel.env
    networks:
      - vivijure
    depends_on:
      - video-finish
      - image-prep
      - audio-beat-sync
      - audio-mix
      - audio-master

# Shared external network (also joined by the cloudflared stack). Create once on
# a fresh box:  docker network create vivijure
networks:
  vivijure:
    name: vivijure
    external: true
