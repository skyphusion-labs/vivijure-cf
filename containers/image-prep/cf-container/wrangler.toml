# Isolated image-prep Cloudflare Container door. Not the studio Worker.
# Deployed on a `v*` tag by the deploy-container-doors job in ci.yml, on a GitHub-hosted linux/amd64
# runner (fleet-chezmoi#2620). A hand deploy is for recovery only, and from an amd64 host.

name = "vivijure-image-prep"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# cf#1401: the door answers only on its custom domain. Its bearer gate already refused a request
# on *.workers.dev, so that second hostname served nobody; skyphusion-monitor tracks both settings.
workers_dev = false
preview_urls = false

# Already this Worker's custom domain (AAAA 100::, proxied).
[[routes]]
pattern = "image-prep.skyphusion.org"
custom_domain = true

# Door bearer. Value is a wrangler secret, never a [vars] entry.
[secrets]
required = ["LOCAL_FINISH_TOKEN"]

[[containers]]
class_name = "ImagePrepDoor"
image = "../Dockerfile"
image_build_context = ".."
instance_type = "standard-1"
max_instances = 2

[[durable_objects.bindings]]
name = "PREP"
class_name = "ImagePrepDoor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImagePrepDoor"]
