name: CI

# Typecheck + test on every push and PR. DEPLOY ONLY on a version tag (v*), NEVER on a bare push
# to main -- an ordinary merge (even a docs-only one) must not redeploy production. A mid-render
# merge once auto-deployed the core worker and reset the orchestration Durable Object, freezing a
# live render. Releases are now deliberate: cut a SemVer tag to ship.
#   git tag v0.158.0 && git push origin v0.158.0
# vivijure is PUBLIC and accepts outside PRs, so CI runs on GitHub-hosted ubuntu-latest (fork-safe
# sandbox), not the self-hosted fleet pool.
on:
  push:
    branches: [main]
    tags: ["v*"]
  # NO branches filter, deliberately. With `branches: [main]` a STACKED pr (base = another
  # branch, e.g. #64 onto #67) matches nothing and runs ZERO checks -- and GitHub reports
  # "no checks reported", which reads as fine rather than as unverified. Every PR runs
  # typecheck + tests, whatever its base.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # cf#562: a tag run now PUBLISHES (the studio-release job below) as well as deploys, so
  # cancelling it mid-flight can abandon a half-published release -- exactly what the old
  # studio-release.yml cancel-in-progress: false existed to prevent before it was folded in here.
  # Branch and PR runs keep cancelling, which is what keeps the queue usable; tag runs never do.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The vanilla-JS frontend is deliberately build-free, so tsc never sees it and a call to a
      # function that no longer exists is valid syntax `node --check` happily accepts. Three such
      # defects shipped into the hosted assets in one night (a helper deleted, its call sites left
      # behind); each was caught only by driving the page in a browser. This is that check, run as a
      # step of the required `ci` job so it inherits branch protection. Overrides are per-identifier
      # and need a reason; there is no way to silence a whole file. See scripts/resolve-guard.mjs.
      - name: Resolve guard (frontend calls resolve)
        run: npm run guard:resolve

      - name: Test
        run: npm test

      # cf#470. The tenant module catalog is defined in vivijure-control-plane and MIRRORED here
      # at scripts/tenant-module-catalog.txt, because this repo cannot import the other one. That
      # mirror used to be a literal inside the readiness test with its length asserted beside it,
      # so the test compared the copy against itself: the catalog went 6 -> 7 -> 15 and nothing
      # failed once, while the published denominator and a reach-boundary claim in the docs were
      # wrong for four days.
      #
      # This is the only step that can detect that, because it is the only one that reads the
      # authority. It fetches raw.githubusercontent.com with NO credential (all three repos are
      # public, so it runs on fork PRs too) and FAILS CLOSED: a fetch error, an empty parse on
      # either side, or a self-control that does not fire is a non-zero exit, never a skip.
      #
      # A step of the required `ci` job, deliberately: a catalog change in the plane turns this
      # repo red until the mirror and the population-4 numbers in docs/module-readiness-coverage.md
      # are corrected. That is the work the silence was hiding. A non-blocking version of this is a
      # cross-reference, not a control.
      - name: Tenant module catalog matches the control plane (cf#470)
        run: npm run check:catalog

      # vivijure#824. The hub's docs/CAPABILITIES.md is the one place that states what the studio
      # offers, and modules/ here is the authority for what exists. This is the only step that can
      # tell those two apart, so it runs where the population is and fetches the document.
      #
      # DELIBERATE CONSEQUENCE: adding or removing a module in this repo turns THIS repo red until
      # the matrix row lands at the hub. Same trade as check:catalog above and for the same reason.
      # The alternative is a public document that quietly stops being true, which is exactly how a
      # $5/month capability outlived its own removal. The remedy is a one-row edit.
      #
      # Credential-free: both repos are public, so this runs on fork PRs too. Fails closed on a
      # fetch error, a non-200, an empty body or an unparseable one; it never degrades to a skip.
      - name: Capability matrix matches the modules that exist (vivijure#824)
        run: npm run check:matrix

      # deploy/ has a pytest suite (installer/teardown control plane). Without this step,
      # Python regressions in vivijure_deploy.py pass CI silently (#26).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Deploy unit tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest deploy/ -q

      # cf#539/cf#510: these two scripts drive scripts/changelog-entry-required.py and
      # scripts/changelog-assemble.py against synthetic fixtures, including fixtures that
      # reproduce the exact bugs each guards against (a two-dot false pass, an assemble run that
      # would target the wrong heading). Plain self-checking scripts (non-zero exit on any failed
      # assertion), same shape as the container test scripts below -- not pytest-discovered, so
      # they are invoked explicitly rather than swept up by the deploy/ suite above.
      - name: Changelog fragment guard + assembler tests (cf#539, cf#510)
        run: |
          python3 tests/changelog-entry-required.test.py
          python3 tests/changelog-assemble.test.py

      # cf#372. The hosted studio pin is advanced by scripts/advance-studio-pin.sh on the release
      # path, where a defect would repoint every future hosted tenant. This suite drives every
      # refusal arm against a local stand-in for the GitHub API, and its load-bearing assertions are
      # the ones about requests NOT sent: a refusal that still issued the PATCH would print a
      # refusal and change hosted anyway, which an exit-code-only test cannot distinguish.
      - name: Hosted studio pin advance guards (cf#372)
        run: python3 tests/advance-studio-pin.test.py

  # CONTAINER TESTS (cf#325): the CPU containers ship their own test_*.py files and NONE of them
  # ran anywhere -- this workflow's only pytest invocation above is scoped to deploy/. A suite
  # nothing runs is indistinguishable from a suite that passes; both produce a green pipeline and
  # no output. test_url_guard.py is the one that stings: it is the SSRF guard on every URL a
  # container fetches or PUTs to, reached from /finish, /overlay, /film-titles, /subtitle,
  # /inspect and /frames, and it has never once executed.
  #
  # These are plain scripts (`python3 test_X.py`, non-zero exit on any failed assertion), not
  # pytest-discoverable `def test_*` functions -- widening the pytest path above to containers/
  # would have pytest IMPORT each file (which runs their module-level checks as a side effect of
  # collection, not as a real pytest item) and, worse, silently COLLECT ZERO actual test items for
  # every one of them: pytest exits 0 on zero collected tests unless told otherwise, which is
  # exactly the "0 tests collected reads as success" trap this issue exists to close, arriving
  # through the fix rather than the original gap. Running each script explicitly and counting them
  # sidesteps it.
  #
  # SCOPED to what is proven safe on THIS runner, established by actually running it here rather
  # than assumed: `test_url_guard.py` (vendored byte-for-byte per its own docstring, stdlib only,
  # no ffmpeg, no network) from every container that carries a copy, plus video-finish's own
  # `test_inspect.py` and `test_photometric_gate.py` (both stdlib only -- the latter is cf#532's
  # pixel-identity gate, proving the RATIO MATH via an injected decoder rather than real ffmpeg;
  # its real-ffmpeg proof, test_local.py, is NOT run here for the same runner-availability
  # reason test_local.py is not run for the two audio containers below), `test_async.py` /
  # `test_meta_sidecar.py` (need aiohttp, pinned from video-finish's own requirements.txt so a
  # version bump there is picked up automatically instead of drifting from what the built image
  # runs), and `test_ffmpeg_timeout.py` in video-finish / audio-mix / audio-master (cf#571:
  # a real sleep child, named FfmpegTimeout, no ffmpeg binary required).
  #
  # NOT run here, deliberately, and left open on cf#325 rather than silently skipped:
  # `containers/audio-master/test_local.py` and `containers/audio-mix/test_local.py`. Both drive
  # real ffmpeg/ffprobe DSP validation (loudness, ducking) against synthesized audio, and this
  # issue's own suggested handling is right that ffmpeg presence on this runner has to be
  # established BY EFFECT (`ffmpeg -version`, exit status), never by `command -v` -- that is
  # unstarted work, not a solved one skipped for space.
  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install video-finish test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r containers/video-finish/requirements.txt

      # cf#857 / cf#851. UNCONDITIONAL and DOCKER-FREE on purpose: this is the gate that would have
      # caught the crash in the PR that caused it, in milliseconds, with no daemon and no build.
      # cfa321f added containers/video-finish/concat_guard.py plus a column-0 import of it in app.py,
      # added its test to the list below in the same commit, and never touched the Dockerfile COPY
      # line. Every image built since then dies at import before binding :8000, and the step below
      # stayed green the whole time because it runs these scripts from the REPO CHECKOUT, where the
      # file is present. The image is never involved here. That is the entire gap.
      - name: Container image file-set guard (cf#857)
        run: python3 tests/container-image-file-set.test.py

      - name: Run container test scripts
        run: |
          set -eu
          scripts="
          containers/audio-beat-sync/test_url_guard.py
          containers/audio-mix/test_url_guard.py
          containers/image-prep/test_url_guard.py
          containers/video-finish/test_url_guard.py
          containers/video-finish/test_inspect.py
          containers/video-finish/test_photometric_gate.py
          containers/video-finish/test_async.py
          containers/video-finish/test_meta_sidecar.py
          containers/video-finish/test_concat_guard.py
          containers/video-finish/test_chunked_contract.py
          containers/video-finish/test_upload_streams.py
          containers/video-finish/test_ffmpeg_timeout.py
          containers/audio-mix/test_ffmpeg_timeout.py
          containers/audio-master/test_ffmpeg_timeout.py
          "
          ran=0
          for script in $scripts; do
            if [ ! -f "$script" ]; then
              echo "::error::expected container test script missing: $script (list drifted from disk)"
              exit 1
            fi
            echo "=== $script ==="
            dir="$(dirname "$script")"
            file="$(basename "$script")"
            (cd "$dir" && python3 "$file")
            ran=$((ran + 1))
          done
          # cf#325's own warning, restated as a check: a pytest run that collects zero test files
          # exits 0 and looks identical to a green run. This is that floor for a script runner --
          # assert the count actually executed, not just that the loop returned without an error.
          echo "ran ${ran} container test scripts"
          if [ "$ran" -ne 14 ]; then
            echo "::error::expected exactly 14 container test scripts to run, ran ${ran}"
            exit 1
          fi

  # BUNDLE GATE (#797). studio-release.yml runs `wrangler deploy --dry-run` against the real
  # rendered config, and it is the ONLY gate that can see a durable_objects binding whose class is
  # not exported from the entrypoint. That workflow is TAG-GATED, so on a pull request it reads
  # SKIPPED and the defect is invisible at exactly the moment a human is reviewing.
  #
  # This is not hypothetical: #798 declared the FinishContainer class in wrangler.toml and was
  # green on 13 checks with no export in src/. The failure would have fired at the next `v*` tag,
  # in the release bundle step, taking the whole studio release down and landing on whoever tagged
  # next for an unrelated reason.
  #
  # Credential-free AND Docker-free by design. `--dry-run` never contacts the account, so this runs
  # on GitHub-hosted ubuntu-latest with no secrets and a fork PR exercises the same gate.
  # `--containers-rollout=none` skips the container image BUILD, which otherwise requires the Docker
  # CLI even in dry-run mode, while still validating the config, the bindings and the bundle. That
  # split is the whole point: the class-export check runs, the image build does not.
  #
  # Verified both directions before this landed, because a gate never seen to fail is decoration:
  # deleting the `export { FinishContainer }` line makes this step exit 1 with "Your Worker depends
  # on the following Durable Objects, which are not exported in your entrypoint file:
  # FinishContainer", and restoring it makes it pass.
  bundle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The same render path studio-release.yml uses, with EMPTY substitutions on purpose: this
      # gate checks the SHAPE of the config and the bundle, never account-specific ids, so unset
      # vars are correct here and are what keep it credential-free and fork-safe.
      - name: Render a throwaway wrangler.toml from the committed example
        run: |
          set -euo pipefail
          sh scripts/strip-local-gpu.sh wrangler.toml.example .wrangler.hosted.toml
          envsubst < .wrangler.hosted.toml > wrangler.toml

      - name: Bundle the studio worker (wrangler --dry-run, no container build)
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir=bundle-out

  # CONTAINER DEPLOY-SHAPE GATE (cf#809 follow-up, asked for in the #812 review).
  #
  # WHAT bundle-gate ABOVE CANNOT SEE, and why that is not a criticism of it. bundle-gate passes
  # --containers-rollout=none so it stays Docker-free, credential-free and fast on every PR. That
  # flag SKIPS the container image build. So bundle-gate answers "does the worker bundle", and it
  # was read as answering "does the deploy work" -- which is exactly how cf#798 merged green while
  # arming a deploy failure that only a v* tag could reach. A gate that passes by not performing the
  # step it is supposed to cover is the failure mode, and this job is the missing step.
  #
  # THE REAL BUILD, and it is `wrangler deploy --dry-run` with the rollout flag OMITTED. MEASURED on
  # the runner, not assumed: that job's log carries 1317 buildkit step lines, 394 apt-get lines, and
  # all three of the Dockerfile's ffmpeg sanity-encode markers (libx264, drawtext, libass). --dry-run
  # keeps it credential-free and fork-safe -- nothing contacts the account, nothing is pushed -- and
  # it still builds, because the image is an input to the bundle wrangler is asked to produce.
  #
  # TWO THINGS I GOT WRONG HERE FIRST, recorded so the next reader does not repeat either.
  #
  #   1. I briefly concluded this dry-run does NOT build, from a 40-second duration plus a `grep ...
  #      | tail -40` of the log. Both were bad instruments: 40s is ample for this image on a runner,
  #      and a truncated, filtered view is not evidence of absence. Counting over the WHOLE log
  #      settled it in the opposite direction.
  #   2. The replacement I reached for, `wrangler containers build <dir> --push=false`, CANNOT be
  #      used here: it requires CLOUDFLARE_API_TOKEN even when it pushes nothing, and this gate must
  #      run on fork PRs with no secrets. It exits 1 with "In a non-interactive environment, it's
  #      necessary to set a CLOUDFLARE_API_TOKEN environment variable".
  #
  # WHICH IS WHY THE BUILD IS ASSERTED, not assumed, in the step below. The whole point of this gate
  # is that bundle-gate passes by skipping the build; a future wrangler that stops building in
  # dry-run would turn THIS gate into the same decoration without anything going red. I could not
  # tell those two states apart by eye, so the job is not allowed to either.
  #
  # WHY IT IS PATH-FILTERED, and why the filter is NARROWER than container-pr-build.yml's. This job
  # asks "does the DEPLOY SHAPE still assemble", which changes when the wrangler config changes or
  # when the Dockerfile wrangler is pointed at changes. It does NOT change when a pin moves in
  # requirements.txt -- container-pr-build.yml owns that question and builds the real image for it.
  # Filtering this way keeps an ffmpeg build off every unrelated PR and avoids building the same
  # image twice for a change that only one of the two gates is about.
  #
  # WHY IT IS NOT IN container-pr-build.yml, which already has a path filter and buildx: that
  # workflow's verify job fail-closes on "zero containers selected", deliberately, to catch a
  # false-zero matrix. A wrangler-config-only change selects zero CONTAINERS while still needing
  # this gate, so folding it in would have meant weakening that guard to add this one. Two jobs
  # answering two questions beats one job with a softened assertion.
  #
  # TWO JOBS ON PURPOSE. detect -> gate, rather than one job that exits 0 when not applicable. A
  # not-applicable run must render as SKIPPED, not as a green tick: an absent check reads exactly
  # like a passed one, and this repo has now been bitten by that twice in one night.
  container-deploy-shape-detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.pick.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does this change touch the deploy shape?
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # On a push (main or a tag) there is no PR base to diff against, and a tag runs the REAL
          # deploy anyway. Run the gate rather than invent a base.
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "not a pull_request (no base/head sha): running the gate rather than guessing a diff"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # THE STRUCTURAL DENOMINATOR. Every Dockerfile named by a [[containers]] image line, read
          # from the config rather than hand-listed, so adding a second container cannot silently
          # leave this gate looking at the first one forever.
          IMAGES="$(grep -E '^image[[:space:]]*=' wrangler.toml.example | sed -E 's/^image[[:space:]]*=[[:space:]]*"(.*)"$/\1/' | sed -E 's#^\./##')"
          echo "Dockerfiles named by [[containers]]:"; echo "${IMAGES}" | sed 's/^/  /'
          if [ -z "${IMAGES}" ]; then
            echo "::error::no [[containers]] image line in wrangler.toml.example. Either the block was removed (then remove this gate in the same change) or the parse drifted; refusing to report a pass over an empty set."
            exit 1
          fi

          # Three-dot against the merge base, so commits that landed on the base branch after the
          # branch point are not attributed to this PR. Same rule as the changelog gate.
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"

          NEEDED=false
          if echo "${CHANGED}" | grep -qx 'wrangler\.toml\.example'; then
            echo "wrangler.toml.example changed -> deploy shape may have moved"
            NEEDED=true
          fi
          for img in ${IMAGES}; do
            if echo "${CHANGED}" | grep -qxF "${img}"; then
              echo "${img} changed -> what wrangler builds has moved"
              NEEDED=true
            fi
            # cf#857: THE DOCKERFILE IS NOT THE IMAGE. A Dockerfile's build CONTEXT is its directory,
            # so every file COPYed in can change what the image contains without the Dockerfile path
            # appearing in the diff at all. Matching only the Dockerfile meant a PR touching just
            # containers/video-finish/app.py ran neither container gate, which is the hole the
            # cf#851 class walks through. Widening can only ADD runs, never remove them.
            ctx="$(dirname "${img}")"
            for f in ${CHANGED}; do
              case "$f" in
                "${ctx}/"*)
                  echo "${f} changed -> it is inside ${ctx}, the build context of ${img}"
                  NEEDED=true
                  ;;
              esac
            done
          done
          # NO REGEX BUILT FROM A STRING above: `case` prefix matching needs no escaping, so the
          # incomplete-sanitizer class is unreachable by construction rather than by a correct escape.
          if echo "${CHANGED}" | grep -qx '\.github/workflows/ci\.yml'; then
            echo "ci.yml changed -> a change to this gate is tested by this gate"
            NEEDED=true
          fi
          for own in scripts/container-smoke.sh tests/container-smoke.test.sh; do
            if echo "${CHANGED}" | grep -qxF "${own}"; then
              echo "${own} changed -> a change to the smoke gate is tested by the smoke gate"
              NEEDED=true
            fi
          done

          echo "needed=${NEEDED}" >> "$GITHUB_OUTPUT"
          echo "deploy-shape gate needed: ${NEEDED}"

  container-deploy-shape:
    needs: container-deploy-shape-detect
    if: needs.container-deploy-shape-detect.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --no-audit --no-fund

      # Same render as bundle-gate: EMPTY substitutions, because this checks the SHAPE of the
      # config and the build, never account-specific ids. That is what keeps it credential-free.
      - name: Render a throwaway wrangler.toml from the committed example
        run: |
          set -euo pipefail
          sh scripts/strip-local-gpu.sh wrangler.toml.example .wrangler.hosted.toml
          envsubst < .wrangler.hosted.toml > wrangler.toml

      - name: Prove the instrument can see a container at all
        run: |
          set -eu
          command -v docker >/dev/null 2>&1 || { echo "::error::docker CLI missing; this gate cannot make its claim"; exit 1; }
          docker version --format "{{.Server.Version}}" >/dev/null 2>&1 || { echo "::error::docker daemon unreachable; this gate cannot make its claim"; exit 1; }
          grep -q '^\[\[containers\]\]' wrangler.toml || { echo "::error::no [[containers]] block survived the render, so a green result here would mean nothing was built"; exit 1; }
          echo "docker OK and a [[containers]] block is present; the real build below is a real assertion."

      # NO --containers-rollout=none. That omission IS the gate: it is what makes wrangler build the
      # [[containers]] image instead of skipping it.
      - name: wrangler deploy --dry-run WITH the container build
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir=shape-out 2>&1 | tee shape-build.log

      # THE CONTROL ON THE CONTROL. A pass here must mean an image was BUILT, and nothing in the
      # step above distinguishes "built it" from "quietly skipped it" -- which is precisely how
      # bundle-gate came to be read as covering a step it skips. So the build is proven from the
      # log's own evidence, and the absence of that evidence is a failure rather than a pass.
      - name: Prove an image was actually built
        run: |
          set -eu
          if [ ! -s shape-build.log ]; then
            echo "::error::no build log was produced, so nothing can be claimed about the image"
            exit 1
          fi
          # Any ONE of these only appears when buildkit really ran. CACHED counts: a cache hit is
          # still a resolved, buildable image, and this runner has no cache on a first run anyway.
          if grep -qE "exporting to image|sanity-encode OK|^#[0-9]+ (CACHED|DONE)| CACHED$" shape-build.log; then
            echo "build evidence found:"
            grep -oE "exporting to image|[a-z0-9()]+ sanity-encode OK" shape-build.log | sort -u | sed 's/^/  /'
            exit 0
          fi
          echo "::error::wrangler exited 0 but produced NO container build output. Either --containers-rollout=none crept back in, or wrangler no longer builds during --dry-run. Do not merge on this green: the gate is not covering the step it claims to. See the header comment above this job."
          echo "--- last 40 lines of the build log"
          tail -40 shape-build.log
          exit 1

  # CONTAINER SMOKE (cf#857). The gate that starts the image and makes it SERVE.
  #
  # WHY IT EXISTS, and it is this repo indicting its own work: `container-deploy-shape` above was
  # built in cf#817/cf#818 and it proves an image was BUILT. `container-tests` runs the container's
  # python scripts against the repo CHECKOUT. Neither one starts the image, so the only property
  # anyone wants from a container gate -- does this boot and bind its port -- was unasserted, and the
  # v1.34.1 tag run (36296493766) went green on all 10 jobs over an image that crashed on every
  # startup: "Container crashed while checking for ports", 12 occurrences in one tail session,
  # assemble to failure in 3,211 ms (cf#851). BUILT and RUNS are different properties.
  #
  # THE CONTROL RUNS BEFORE THE SUBJECT, and that ordering is the whole design. cf#857 is about a
  # gate that could not fail, so this job first drives scripts/container-smoke.sh against three
  # fixtures it builds -- one that serves, one that dies at import (the cf#851 shape, planted), one
  # that binds the wrong port -- and asserts the EXACT exit code and reason for each. A smoke step
  # that has only ever gone red is indistinguishable from one that always goes red; a smoke step that
  # has only ever gone green is the thing we are replacing. Both directions, or neither claim.
  #
  # NOTHING HERE IS SKIPPABLE. No docker CLI, no daemon, no curl, an unbuildable image, a container
  # that exits, a port that never answers: every one is a FAILURE, never a skip. A gate whose
  # cheapest satisfaction is not running the container is the same defect one level up, which is what
  # the issue this closes is about.
  container-smoke:
    needs: container-deploy-shape-detect
    # On a version tag this runs UNCONDITIONALLY rather than through the detect, for two reasons: a
    # release must never be able to skip the only gate that starts the image, and `deploy` lists this
    # job in `needs`, where a SKIPPED dependency would skip the deploy itself. The detect already
    # reports needed=true when there is no PR base to diff, so this is belt-and-suspenders against a
    # future edit to that script, not a second opinion about it.
    if: needs.container-deploy-shape-detect.outputs.needed == 'true' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Prove the instrument exists before claiming anything with it
        run: |
          set -eu
          command -v docker >/dev/null 2>&1 || { echo "::error::docker CLI missing; this gate cannot make its claim (and must not pass)"; exit 1; }
          docker version --format "{{.Server.Version}}" >/dev/null 2>&1 || { echo "::error::docker daemon unreachable; this gate cannot make its claim (and must not pass)"; exit 1; }
          command -v curl >/dev/null 2>&1 || { echo "::error::curl missing; this gate cannot probe a port"; exit 1; }
          echo "docker $(docker version --format '{{.Server.Version}}') and curl are present."

      # FIRST: prove the smoke script can both PASS and FAIL, against subjects whose truth is known
      # by construction. Everything below is uninterpretable without this.
      - name: Control -- the smoke script passes a serving image and fails two planted failures
        run: sh tests/container-smoke.test.sh

      # THEN: the real subject. Built from the Dockerfile the [[containers]] block NAMES, read out of
      # the committed example rather than hand-listed, so a second container cannot leave this gate
      # staring at the first one forever.
      - name: Build every image the [[containers]] block names
        run: |
          set -eu
          IMAGES="$(grep -E '^image[[:space:]]*=' wrangler.toml.example | sed -E 's/^image[[:space:]]*=[[:space:]]*"(.*)"$/\1/' | sed -E 's#^\./##')"
          if [ -z "${IMAGES}" ]; then
            echo "::error::no [[containers]] image line in wrangler.toml.example: refusing to report a pass over an empty set. If the block was removed, remove this job in the same change."
            exit 1
          fi
          built=0
          for img in ${IMAGES}; do
            [ -f "${img}" ] || { echo "::error::${img} is named by [[containers]] but does not exist on disk"; exit 1; }
            ctx="$(dirname "${img}")"
            tag="vivijure-cf857-smoke-$(basename "${ctx}"):ci"
            echo "=== building ${img} (context ${ctx}) as ${tag}"
            docker build -f "${img}" -t "${tag}" "${ctx}"
            echo "${tag}" >> images.txt
            built=$((built + 1))
          done
          echo "built ${built} image(s)"
          [ "${built}" -gt 0 ] || { echo "::error::built 0 images; a loop that ran zero times exits 0 and looks exactly like a pass"; exit 1; }

      - name: Smoke every built image -- it must SERVE, not merely exist
        run: |
          set -eu
          [ -s images.txt ] || { echo "::error::no images.txt, so the previous step built nothing and this step would pass over an empty list"; exit 1; }
          n=0
          while read -r tag; do
            [ -n "${tag}" ] || continue
            echo "=== smoking ${tag}"
            sh scripts/container-smoke.sh "${tag}" 8000 /health 90
            n=$((n + 1))
          done < images.txt
          echo "smoked ${n} image(s)"
          [ "${n}" -gt 0 ] || { echo "::error::smoked 0 images"; exit 1; }

  # MIGRATIONS GATE (cf#358): 0016_render_output_ms.sql shipped in v1.19.0 and the FIRST place
  # it was ever applied was PRODUCTION, at the deploy job's `wrangler d1 migrations apply
  # vivijure-studio --remote` step below. A syntax error or a migration that references a
  # column a LATER migration adds was discoverable only by breaking prod. This replays every
  # migrations/*.sql file, in filename order, against a throwaway LOCAL D1 (wrangler's built-in
  # --local Miniflare sqlite) and fails the build if any statement errors.
  #
  # Credential-free by design: --local never contacts a Cloudflare account, so this runs on
  # GitHub-hosted ubuntu-latest (public repo, fork-safe) with no secrets, and a fork PR exercises
  # the exact same gate a same-repo PR does. The wrangler.toml written below is a THROWAWAY
  # scratch config, not the real one (that file is gitignored and rendered from
  # wrangler.toml.example with account-specific secrets only in the deploy job); its
  # database_id is a placeholder wrangler only uses to name the local sqlite dir.
  migrations-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Write scratch D1 config
        run: |
          cat > wrangler.migrations-gate.toml <<'EOF'
          name = "vivijure-studio-migrations-gate"
          compatibility_date = "2026-01-01"

          [[d1_databases]]
          binding = "DB"
          database_name = "vivijure-studio-migrations-gate"
          database_id = "00000000-0000-0000-0000-000000000000"
          EOF

      - name: Apply migrations to throwaway local D1
        run: npx wrangler d1 migrations apply DB --local --config wrangler.migrations-gate.toml

      # cf#520: migrations/manual/ had ZERO automated coverage. wrangler's migrations_dir scan is
      # non-recursive by design (that is what keeps these files out of the auto-apply and out of the
      # tenant release bundle), but the side effect was that an operator-run file could carry a
      # syntax error or a stale column reference all the way to the moment it is pasted into a
      # terminal -- which for post-0020-set-live-token-scopes.sql is mid-outage, with four
      # credentials already 403ing. The gate above cannot catch it and never claimed to.
      #
      # These are replayed AFTER the numbered chain, against the same throwaway local D1, because
      # that is the state they are written for. The DB is discarded, so no rollback is needed.
      #
      # A file that is NOT applicable to a freshly-migrated chain opts out explicitly with
      # `-- migrations-gate: skip <reason>` in its header. The skip is printed, so an opt-out is
      # visible in the log rather than silent -- an unexercised file that looks exercised is the
      # failure this step exists to prevent.
      #
      # TWO WAYS THIS ROTS, both known when it was written, neither yet a problem:
      #
      # (1) These files replay against the CURRENT chain, not the chain they were written for. A
      #     future migration touching a column one of them references will break it in CI for
      #     reasons that have nothing to do with the file, and the cheapest way to green is to add
      #     a skip marker. The escape hatch is precisely what gets reached for on the day the chain
      #     moves. If you are here for that reason: fix the file or delete it, do not skip it.
      #
      # (2) The design loses coverage on exactly the files most worth covering. Manual migrations
      #     exist BECAUSE they need production state; CI replays them against empty tables, so a
      #     row-matching statement matches nothing and passes. post-0020's UPDATE is checked for
      #     parse and schema compatibility and NOT for whether it sets the right rows -- that is
      #     proven in the PR's seeded-sqlite replay, not here. A future manual file that genuinely
      #     needs rows will fail on a fresh chain and attract a skip, so the more semantically
      #     important the file, the likelier it ends up uncovered. This step is a syntax and
      #     schema-drift net. It is not a behavioural gate and must not be cited as one.
      - name: Replay operator-run migrations/manual/ against the same local D1
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Coverage is asserted as two SETS OF FILENAMES, not two counts. Counts cannot see a
          # SWAP: if 0004 lost its marker while post-0020 gained one, the totals would still read
          # 1 checked / 1 skipped while coverage was exactly inverted. Sets express the thing the
          # assertion is actually for -- "these files are covered, those are deliberately not" --
          # and every failure names which file moved, so the diff that changes coverage is the diff
          # that updates these lists.
          EXPECTED_CHECKED="post-0020-set-live-token-scopes.sql"
          EXPECTED_SKIPPED="0004_drop_user_email.sql"
          files=(migrations/manual/*.sql)
          echo "manual files found: ${#files[@]}"
          got_checked=""; got_skipped=""
          # Order is glob sort, i.e. filename order. Stated because it is load-bearing the moment a
          # second checked file appears and one depends on the other.
          for f in "${files[@]}"; do
            # ANCHORED to line start, restricted to the header, and a non-blank reason REQUIRED.
            # Unanchored, this opts out on any line mentioning the marker -- including prose that
            # documents the convention, a warning telling you not to use it, and a SQL string
            # literal. Every one of those failure modes lands on SKIP, i.e. silently less coverage
            # with a green step, which is the same self-concealing shape this gate exists to catch.
            if reason=$(head -20 "$f" | grep -m1 -oP '^-- migrations-gate: skip \K\S.*'); then
              echo "SKIP        $f -- $reason"
              got_skipped="$got_skipped $(basename "$f")"
              continue
            fi
            # PARSE+APPLY, not "validated". This proves the file parses and is schema-compatible
            # with the freshly-migrated chain. It does NOT prove the file does its job: these
            # tables are empty, so a row-matching UPDATE legitimately matches nothing and passes.
            echo "PARSE+APPLY $f"
            npx wrangler d1 execute DB --local --config wrangler.migrations-gate.toml --file "$f"
            got_checked="$got_checked $(basename "$f")"
          done
          # `|| true` is load-bearing: grep returns 1 on no match, and under `set -e` that killed
          # the step before it could print WHY it failed. An empty migrations/manual/ then exited
          # non-zero with no diagnosis -- correct direction, useless message. A guard that fails
          # without asserting its own reason is only half a guard.
          norm() { tr " " "\n" <<<"$1" | { grep -v '^$' || true; } | sort | tr "\n" " " | sed "s/ $//"; }
          got_c=$(norm "$got_checked"); got_s=$(norm "$got_skipped")
          exp_c=$(norm "$EXPECTED_CHECKED"); exp_s=$(norm "$EXPECTED_SKIPPED")
          echo "manual/ replay -- checked: [$got_c]  skipped: [$got_s]"
          if [ "$got_c" != "$exp_c" ] || [ "$got_s" != "$exp_s" ]; then
            echo "::error::migrations/manual/ coverage does not match what this step asserts."
            echo "::error::  checked  expected [$exp_c]  got [$got_c]"
            echo "::error::  skipped  expected [$exp_s]  got [$got_s]"
            echo "::error::A file moved between covered and skipped, was added, or was removed. If that is intended, edit EXPECTED_CHECKED / EXPECTED_SKIPPED in this step in the SAME PR so the coverage change is reviewed. Do NOT empty these lists to make this pass -- an empty EXPECTED_CHECKED makes this step permanently vacuous, which is the failure it exists to prevent."
            exit 1
          fi

  # SECURITY GATE (fc#859): a v* tag can point at ANY commit, including one that never merged.
  # The org tag ruleset enforces deletion + non_fast_forward only, so `git tag v9.9.9 <unmerged>
  # && git push origin v9.9.9` would deploy unreviewed code to prod, routing around branch
  # protection. This refuses that. It has always run on ubuntu-latest with a real git checkout, so
  # merge-base can walk main; before cf#809 the deploy job could not host this check at all, because
  # it ran in a container image without git and actions/checkout fell back to the REST API. Same tag-only condition as `deploy`: this repo
  # publishes ONLY on a v* tag (deploy is itself gated on refs/tags/v*), so there is no
  # branch-dispatch publish path to guard.
  assert-on-main:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert built commit is on main (no deploy of an unreviewed commit)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "::error::commit ${head} is not on origin/main; refusing to deploy an unreviewed commit"
            exit 1
          fi
          echo "commit ${head} is on origin/main; ancestry guard passed."

  # fc#2250: TAG-VS-VERSION AS A JOB, not a step.
  #
  # The assert itself is not new -- studio-release.yml has carried it since cf#272 -- but it lived
  # as a STEP inside studio-release, and a step cannot gate a SIBLING job. `deploy` and
  # `studio-release` are siblings on the same needs: array, so:
  #
  #   * `v1.99.0` pushed on a commit whose package.json says 1.33.9 deployed the Worker, applied
  #     remote D1 migrations and deployed MCP; the assert then fired in the other job, after prod
  #     had already moved. cf#272 caught the mislabelled RELEASE and never guarded the DEPLOY.
  #   * The fix is the same shape cf#562 used for the ordering problem: promote the thing everyone
  #     must pass into a JOB both publishing paths depend on, rather than duplicating the step.
  #
  # ubuntu-latest, deliberately, and for the reason assert-on-main states one job up: the deploy job
  # runs in `container: node:22-alpine`, whose actions/checkout falls back to the REST API and leaves
  # no .git, so gates that need a real checkout live in their own ubuntu-latest job. This one only
  # needs package.json, but keeping both guards the same shape means the next one is obvious.
  #
  # Non-v refs cannot reach here (the if: below), so unlike the studio-release step there is no
  # notice-and-pass branch: on this trigger the ref is always a v* tag.
  assert-tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          pkg="$(node -p "require(\"./package.json\").version")"
          if [ "$want" != "$pkg" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${pkg} -- refusing to deploy or publish a mislabelled build"
            exit 1
          fi
          echo "tag ${TAG} matches declared version ${pkg}."

  deploy:
    # DEPLOY GATE: this job runs ONLY for a pushed version tag (refs/tags/v*), after ci passes.
    # A push/merge to main runs `ci` above but never reaches here, so no merge can redeploy prod
    # (and no merge can bite an in-flight render). To release: push a SemVer tag vX.Y.Z.
    # cf#526 follow-up: `container-tests` and `migrations-gate` BOTH RUN on a tag push -- neither
    # carries an `if:`, so the workflow's `tags: ["v*"]` trigger starts them -- and neither was in
    # this list. A tag could therefore deploy to production with either one RED, and nothing would
    # report that: the deploy job simply never looked.
    #
    # `migrations-gate` is the one that makes this urgent. It guards SCHEMA. A deploy that ships a
    # worker whose migrations gate failed is the shape where the code arrives and the database it
    # expects does not.
    #
    # Adding them cannot deadlock: both run unconditionally on this trigger, so `needs` will always
    # resolve rather than wait on a job that never starts. That is the failure mode to check before
    # widening a `needs` array, and it is why this is safe rather than merely stricter.
    # fc#2250: assert-tag-version added. It is tag-gated exactly like assert-on-main, so needs:
    # always resolves on this trigger rather than waiting on a job that never starts -- the check to
    # make before widening a needs: array, and the same argument the paragraph above makes.
    # cf#857: container-smoke added, by the same argument the two paragraphs above make about
    # container-tests and migrations-gate. Before this, NOTHING that starts the container gated a
    # release -- container-deploy-shape is not in this list either, so a tag could deploy with it
    # RED and the deploy job would simply never look. That is how a crashing image reached
    # production green (cf#851).
    #
    # THE DEADLOCK CHECK, which is the thing to make before widening a needs: array. container-smoke
    # carries an `if:`, so unlike the other five it COULD be skipped -- and a skipped dependency
    # skips the dependent job, which would silently turn a release into a no-op. Its `if:` therefore
    # includes `startsWith(github.ref, 'refs/tags/v')` explicitly, so on this trigger it always runs
    # and needs: always resolves. container-deploy-shape is deliberately NOT added: it proves a
    # BUILD, and container-smoke builds each image itself before starting it, so the stronger gate
    # subsumes it on this path rather than adding a second conditional dependency.
    needs: [ci, container-tests, container-smoke, migrations-gate, assert-on-main, assert-tag-version]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # cf#809: this job used to run in `container: node:22-alpine`, and #798 broke it the moment it
    # merged. The [[containers]] block added there sets `image` to a LOCAL Dockerfile path, and
    # `wrangler deploy` builds that image with the Docker CLI before it uploads anything -- the
    # alpine image has neither the CLI nor a daemon, so the FIRST v* tag after #798 would have died
    # at "Deploy core worker", whatever that tag was cut for.
    #
    # Measured on b531015, same tree, same command, one flag apart:
    #   npx wrangler deploy --dry-run --containers-rollout=none  -> RC=0, names the container app
    #   npx wrangler deploy --dry-run                            -> RC=1, "The Docker CLI is needed
    #                                                               to build the configured image
    #                                                               before deploying (even in
    #                                                               dry-run mode)"
    #
    # And NO gate could see it: bundle-gate passes --containers-rollout=none, which is exactly the
    # flag that skips the build. Green everywhere, reachable only by pushing a tag.
    #
    # So the job runs natively on the runner, which ships Docker. Node comes from setup-node instead
    # of from the image. The steps below were written for BusyBox ash and are plain POSIX, which
    # bash runs unchanged; the package installs they did at runtime are now presence assertions.
    timeout-minutes: 30 # the ffmpeg image build is now part of this job, not just the upload
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ancestry gate lives in assert-on-main. Do NOT repeat it here -- one definition of that
      # invariant, in the job whose whole purpose is to assert it.

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Prove the container toolchain BEFORE anything is deployed. `wrangler deploy` needs the
      # Docker CLI for the [[containers]] image, and a missing CLI must stop the job here rather
      # than halfway through, with the module workers already live and the core not.
      - name: Assert the container build toolchain is present
        run: |
          set -eu
          command -v docker >/dev/null 2>&1 || { echo "::error::docker CLI missing on this runner -- wrangler cannot build the [[containers]] image (cf#809)"; exit 1; }
          docker version --format "{{.Server.Version}}" >/dev/null 2>&1 || { echo "::error::docker daemon not reachable -- wrangler cannot build the [[containers]] image (cf#809)"; exit 1; }
          echo "docker OK: $(docker --version)"

      # SUPERSEDED by #797/#798, and left here corrected rather than deleted because the old text
      # said the exact opposite and someone will come looking for it. video-finish is BACK on
      # Cloudflare Containers (migration v3-finish-container, class FinishContainer), so the
      # "Deploy core worker" step below DOES build and push containers/video-finish/Dockerfile --
      # that is why this job needs Docker (cf#809). The other CPU containers (image-prep,
      # audio-mix, audio-beat-sync, audio-master) are still out-of-band images and are not built
      # here; only the one declared in a [[containers]] block is.

      # Module workers deploy BEFORE the core. The core binds each module as a [[services]] dependency,
      # and a binding to a not-yet-deployed service makes the core `wrangler deploy` fail. Deploying
      # modules first keeps every MODULE_* binding pointing at a live service.
      #
      # DEPLOY-BY-DEFAULT: iterate EVERY modules/*/wrangler.toml, never a hardcoded include-list. A
      # hardcoded list silently drifts -- a new module (or a new scope:install config field on an
      # existing one, e.g. notify-email #300) is added to modules/ but forgotten here, so the live
      # worker stays stale and the registry/UI never sees the change. Worse, the core can bind a
      # [[services]] target the list omits, turning the next core deploy into a dangling-binding
      # failure. Deploying every module dir closes both gaps. If a module ever must be skipped, add
      # its dir name to EXCLUDE below (explicit, reviewable) -- do NOT reintroduce an include-list.
      # POSIX sh, KEPT DELIBERATELY after cf#809 moved this job off `container: node:22-alpine`.
      # The alpine shell that forced it is gone (bash runs this unchanged), but v0.6.1 died here
      # with `shopt: not found` and portable is the cheaper default -- no `shopt`, no `arr=()`
      # arrays, no `${#arr[@]}`. A plain glob `for` loop is portable; an unmatched glob stays
      # literal, so we test `[ -f "$toml" ]` to handle the empty case.
      # No secret step here BY DESIGN: module secrets (RUNPOD_API_KEY / RUNPOD_ENDPOINT_ID / GATEWAY_ID)
      # are bound declaratively from the account-level Cloudflare Secrets Store via [[secrets_store_secrets]]
      # in each module's wrangler.toml, so `wrangler deploy` re-establishes them every run. A fresh-create
      # can no longer start secretless and silently degrade (the v0.2.2 finish-upscale passthrough), and no
      # secret value ever passes through CI/GitHub. Seeding is a one-time out-of-band op (see docs/DEPLOYMENT.md).
      - name: Deploy module workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # SECRETS_STORE_ID is a repo VARIABLE (an identifier, not a secret -- it was public in the
          # repo before #398 templated it out): the account Secrets Store id the module bindings bind.
          SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
          # cf#279: the 6 RunPod-polling modules bind the studio D1 as TELEMETRY_DB. The SAME repo
          # secret the core render already consumes -- no new deploy configuration was introduced.
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # Public HTTPS door origins. fill-module-placeholders.sh writes these into
          # film-titles / subtitle [vars]. Missing here used to ship VIDEO_FINISH_URL=""
          # so title cards passthrough:no-video-finish-url while the studio Worker had
          # the real origin. Same vars as "Render core wrangler.toml" below.
          VIDEO_FINISH_URL: ${{ vars.VIDEO_FINISH_URL }}
          IMAGE_PREP_URL: ${{ vars.IMAGE_PREP_URL }}
          AUDIO_BEAT_SYNC_URL: ${{ vars.AUDIO_BEAT_SYNC_URL }}
          AUDIO_MIX_URL: ${{ vars.AUDIO_MIX_URL }}
          AUDIO_MASTER_URL: ${{ vars.AUDIO_MASTER_URL }}
          FINISH_UPSCALE_DOORS: ${{ vars.FINISH_UPSCALE_DOORS }}
          FINISH_BLENDER_DOORS: ${{ vars.FINISH_BLENDER_DOORS }}
          # #520: the 5 media modules carry a REPLACE_WITH_VPC_*_ID placeholder (no hardcoded prod VPC
          # service id in the tracked tomls). Filled per-module below from these repo secrets.
          VPC_VIDEO_FINISH_ID: ${{ secrets.VPC_VIDEO_FINISH_ID }}
          VPC_AUDIO_BEAT_SYNC_ID: ${{ secrets.VPC_AUDIO_BEAT_SYNC_ID }}
          VPC_AUDIO_MASTER_ID: ${{ secrets.VPC_AUDIO_MASTER_ID }}
          # OPTIONAL (cf#482/#480), AND THESE FOUR NOW HAVE NO CONSUMER -- CORRECTED cf#840.
          # This comment used to say an unset id makes fill-module-placeholders.sh STRIP the door's
          # [[vpc_services]] and [[secrets_store_secrets]] blocks. THERE IS NO SUCH STRIP ANY MORE.
          # Hosted module tomls carry no Workers VPC at all; the script REFUSES a leftover
          # [[vpc_services]] or ${VPC_ rather than filling or stripping it, and
          # tests/optional-binding-wiring-cf507.test.ts asserts that ABSENCE across every
          # modules/*/wrangler.toml. Measured at cf#840: zero module tomls declare a VPC
          # placeholder, the core wrangler.toml.example declares none either, and no script in this
          # repo reads a VPC_*_ID env var -- so the VPC_* lines here and in the core render step
          # below substitute nothing. They are left in place rather than deleted in the cf#840 PR
          # because removing them is a separate deliberate change and a release was in flight.
          # The seam an unset id actually strips today is the DOOR URL vars
          # (FINISH_UPSCALE_DOORS / FINISH_BLENDER_DOORS), and cf#840 made that strip report
          # itself: fill-module-placeholders.sh now prints BOUND/STRIPPED per declared door var,
          # with a ::warning:: on each stripped one, so a forgotten variable is distinguishable
          # from a deliberate opt-out by reading this job's log. Referencing a secret that does not
          # exist still yields "" here, which IS the unset state.
          VPC_FINISH_UPSCALE_ID: ${{ secrets.VPC_FINISH_UPSCALE_ID }}
          # cf#489: same OPTIONAL shape. This one was MISSED when the binding was added, and the
          # deploy stayed GREEN while silently stripping the door blocks. The log line reading
          # VPC_FINISH_BLENDER_ID unset, stripped its optional blocks was the ONLY tell.
          #
          # CORRECTED TWICE, AND THE SECOND CORRECTION IS cf#840. This comment first said "nothing
          # asserts this list against the module tomls that declare the markers", then was updated
          # to say tests/optional-binding-wiring-cf507.test.ts DERIVES the marker set from the
          # module tomls and fails if any declared marker is absent from THIS env block or from the
          # optional-var loop in fill-module-placeholders.sh. That is no longer what the file does:
          # the VPC marker population went to zero, and the test was rewritten to assert the
          # ABSENCE of [[vpc_services]] / REPLACE_WITH_VPC_* / ${VPC_ on every module toml. It
          # asserts nothing about this env block. Read the test, not this comment, for what is
          # covered -- a comment claiming a property the code lacks is what got cf#840 re-filed.
          #
          # Corrected rather than deleted because the stale sentence actively costs time: it
          # invites a reader to re-file the gap as open, which is the failure mode it was warning
          # about, pointed at itself.
          VPC_FINISH_BLENDER_ID: ${{ secrets.VPC_FINISH_BLENDER_ID }}
          # cf#507: the SECOND door on each upscale module, same OPTIONAL shape. Unset is the
          # normal state and strips the blocks, so adding these lines changes nothing until the
          # secrets exist. They are listed HERE because an id missing from this list is the cf#489
          # failure: the deploy stays GREEN and silently strips the door it was meant to bind.
          VPC_FINISH_UPSCALE_PROPAGANDHI_ID: ${{ secrets.VPC_FINISH_UPSCALE_PROPAGANDHI_ID }}
          # CORE-ONLY host switch. vivijure-cf is the stripped host on the PUBLISHED
          # @skyphusion-labs/vivijure-core: it owns the core worker + registry wiring, and the module
          # workers are deployed and managed INDEPENDENTLY (they stay live and are bound by service name
          # from the core [[services]] list). Set CORE_ONLY_DEPLOY=1 (repo variable) so this tag deploy
          # ships the core only and does not touch the live module fleet. Unset (or "0") = full monolith
          # co-deploy behaviour below (deploy every modules/*/wrangler.toml first).
          CORE_ONLY_DEPLOY: ${{ vars.CORE_ONLY_DEPLOY }}
        run: |
          set -eu
          # CORE-ONLY host: skip module deploy entirely (modules are deployed independently and are
          # already live; the core deploy below binds them by service name). Explicit + logged, never a
          # silent skip: if module configs ARE present under CORE_ONLY_DEPLOY they are a drift signal, so
          # warn loudly rather than quietly ignore them.
          if [ "${CORE_ONLY_DEPLOY:-0}" = "1" ]; then
            echo "CORE_ONLY_DEPLOY=1: deploying finish satellite modules (cf#197) + core; skipping other modules."
            export FINISH_SATELLITES_ONLY=1
          fi
          # Deploy-by-default via scripts/deploy-module-workers.sh (canonical list in
          # scripts/finish-satellite-modules.txt when FINISH_SATELLITES_ONLY=1). DO NOT reintroduce
          # a hardcoded include-list: that is what drifted finish-upscale on live (cf#197).
          # cf#560: the HOSTED studio never deploys the local-gpu module worker. Its own manifest
          # blurb names vivijure-cf -- this deploy -- as where commercial use belongs INSTEAD of that
          # door, so binding it here contradicts the door's own licence text.
          #
          # EXCLUDE rather than an include-list, deliberately: the comment above records that a
          # hardcoded include-list is what drifted finish-upscale off live in cf#197. An exclude of
          # one named module keeps deploy-by-default for everything else.
          export EXCLUDE="${EXCLUDE:-} local-gpu"
          chmod +x scripts/deploy-module-workers.sh
          scripts/deploy-module-workers.sh


      # Render the core wrangler.toml from the committed wrangler.toml.example, injecting the
      # account-specific values from encrypted Actions secrets. The real wrangler.toml is gitignored
      # (so the account AUD / resource IDs are not in the public repo); it is rendered fresh here.
      # MUST run BEFORE "Apply D1 migrations": wrangler d1 needs the rendered wrangler.toml to
      # resolve the D1 binding + migrations_dir (the gitignored config does not exist until here).
      # envsubst comes from the runner image now, not from a package install (cf#809); it is asserted
      # present rather than installed. The explicit SHELL-FORMAT var list
      # means ONLY these placeholders substitute -- any other ${...} in the file is left untouched.
      - name: Render core wrangler.toml
        env:
          # #423: auth mode for the rendered config. Prod runs token mode (the edge Access app was
          # removed in the v0.12.0 flip). The render now FAILS LOUD if this var is unset (guard below)
          # instead of defaulting -- an unset default would silently mis-posture prod (e.g. back to
          # access mode with no Access app in front). Set vars.AUTH_MODE explicitly to token or access.
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          VPC_VIDEO_FINISH_ID: ${{ secrets.VPC_VIDEO_FINISH_ID }}
          VPC_IMAGE_PREP_ID: ${{ secrets.VPC_IMAGE_PREP_ID }}
          VPC_AUDIO_BEAT_SYNC_ID: ${{ secrets.VPC_AUDIO_BEAT_SYNC_ID }}
          VPC_AUDIO_MIX_ID: ${{ secrets.VPC_AUDIO_MIX_ID }}
          SPEND_RATE_LIMITER_NS_ID: ${{ secrets.SPEND_RATE_LIMITER_NS_ID }}
          # Opt-in Workers-for-Platforms switch. A repo VARIABLE (not a secret -- not sensitive),
          # unset by default. Only THIS account sets it to "1", after creating the vivijure-modules
          # dispatch namespace out of band. A community fork/self-host never sets it, so their render
          # keeps the [[dispatch_namespaces]] block COMMENTED and deploys on the free plan with zero WfP
          # dependency -- the free-self-host promise. See docs/deploy-runbook.md "Phase 3".
          ENABLE_WFP_DISPATCH: ${{ vars.ENABLE_WFP_DISPATCH }}
          # #238: fills the core [[secrets_store_secrets]] store_id placeholders (same repo var as modules).
          SECRETS_STORE_ID: ${{ vars.SECRETS_STORE_ID }}
          # #238 follow-up: the R2 S3 presign endpoint is account-scoped -- built from the same
          # account id the deploy uses. R2_S3_BUCKET is an OPTIONAL repo-variable override; unset
          # falls back to `vivijure` (the R2_RENDERS bucket_name) in the render shell below.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_S3_BUCKET: ${{ vars.R2_S3_BUCKET }}
          # Public HTTPS door origins (repo VARIABLES, not secrets). Empty = that door is off.
          # These are the vars envsubst must see or wrangler.toml keeps ${VIDEO_FINISH_URL}
          # and the fail-closed placeholder check aborts (v1.32.5).
          VIDEO_FINISH_URL: ${{ vars.VIDEO_FINISH_URL }}
          IMAGE_PREP_URL: ${{ vars.IMAGE_PREP_URL }}
          AUDIO_BEAT_SYNC_URL: ${{ vars.AUDIO_BEAT_SYNC_URL }}
          AUDIO_MIX_URL: ${{ vars.AUDIO_MIX_URL }}
          AUDIO_MASTER_URL: ${{ vars.AUDIO_MASTER_URL }}
          FINISH_UPSCALE_DOORS: ${{ vars.FINISH_UPSCALE_DOORS }}
          FINISH_BLENDER_DOORS: ${{ vars.FINISH_BLENDER_DOORS }}
        run: |
          set -eu
          command -v envsubst >/dev/null 2>&1 || { echo "::error::envsubst (gettext) missing on this runner"; exit 1; }
          # Fail loud on an unset AUTH_MODE (do NOT default): a silent default mis-postures prod, and
          # since the v0.12.0 flip removed the whole-hostname Access app, an accidental var deletion must
          # break the render rather than quietly ship the wrong door. Mirrors deploy.sh (requires AUTH_MODE).
          if [ -z "${AUTH_MODE:-}" ]; then echo "::error::AUTH_MODE repo variable is unset -- refusing to render (set vars.AUTH_MODE to token or access)"; exit 1; fi
          export AUTH_MODE
          # #238 follow-up: render the R2 S3 presign identifiers into [vars] (they are NOT secrets).
          # The endpoint host is account-scoped; build it from CLOUDFLARE_ACCOUNT_ID (the same value
          # wrangler uses to deploy). Fail closed if that id is empty -- an empty account would render
          # https://.r2.cloudflarestorage.com and silently break every presign.
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID unset -- cannot render R2_S3_ENDPOINT"; exit 1; fi
          R2_S3_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"; export R2_S3_ENDPOINT
          R2_S3_BUCKET="${R2_S3_BUCKET:-vivijure}"; export R2_S3_BUCKET
          VARS='$AUTH_MODE $ACCESS_TEAM_DOMAIN $ACCESS_AUD $D1_DATABASE_ID $VPC_VIDEO_FINISH_ID $VPC_IMAGE_PREP_ID $VPC_AUDIO_BEAT_SYNC_ID $VPC_AUDIO_MIX_ID $SPEND_RATE_LIMITER_NS_ID $R2_S3_ENDPOINT $R2_S3_BUCKET $VIDEO_FINISH_URL $IMAGE_PREP_URL $AUDIO_BEAT_SYNC_URL $AUDIO_MIX_URL $AUDIO_MASTER_URL $FINISH_UPSCALE_DOORS $FINISH_BLENDER_DOORS'
          # cf#560: STRIP THE LOCAL-GPU BLOCK. The hosted studio must never bind local-gpu.
          #
          # The door's own manifest blurb says "Self-host only ... Commercial use of Vivijure is
          # supported via vivijure-cf (Cloudflare partner channels), not this door" -- and
          # vivijure-cf IS this deploy. It was bound here anyway, and because it sorts at ui.order 4
          # it was the FIRST entry in both `motion.backend` and `keyframe` on the live registry.
          #
          # THE STRIP AND ITS TWO-SIDED GUARD NOW LIVE IN scripts/strip-local-gpu.sh, NOT HERE, and
          # that move IS the cf#560 fix rather than a tidy-up. They were inline, correct, and passing
          # -- on ONE path. studio-release.yml rendered the same template with a bare envsubst and no
          # strip at all, so a green refusing gate here read as coverage of the invariant, and nothing
          # anywhere reported that a second path existed with no gate on it. A gate that passes
          # because it matched nothing is not evidence, and a gate that was never asked is not
          # evidence either. The remedy for a control that can sit on the wrong path is not a better
          # copy of it, it is not having copies: one definition, invoked by every hosted render, with
          # tests/local-gpu-strip-cf560.test.ts DERIVING the set of hosted render paths from the
          # workflows themselves and refusing if any member does not call it.
          #
          # Unconditional here on purpose: hosted has no INSTALL_LOCAL_GPU case to honour.
          # SATELLITE finish-upscale stays. There is no longer a
          # finish-lipsync block to strip: MuseTalk is ruled out permanently and the module
          # is gone (cf#783), so the strip script and its gate went with it rather than
          # staying on as a control with no subject. SELFHOST-SKIP marks fleet-only blocks,
          # which hosted IS.
          #
          # deploy.sh (SELF-HOST, where local-gpu is ALLOWED) keeps its own INSTALL_LOCAL_GPU switch
          # and deliberately does NOT call this: the invariant is about the HOSTED studio, and
          # bolting the unconditional strip onto the self-host path would remove a door its operator
          # is entitled to run.
          sh scripts/strip-local-gpu.sh wrangler.toml.example .wrangler.hosted.toml
          envsubst "$VARS" < .wrangler.hosted.toml > wrangler.toml
          rm -f .wrangler.hosted.toml
          # fail-closed: no placeholder may survive OUTSIDE comments (a missing secret would leave a
          # literal ${...}); comment-prose mentioning ${...} is fine, and -F keeps the pattern
          # literal on every grep (the v0.16.2 MCP-guard lesson: '${' as a regex is grep-dependent).
          if grep -v '^[[:space:]]*#' wrangler.toml | grep -qF '${'; then echo "::error::unsubstituted placeholder in wrangler.toml"; grep -nF '${' wrangler.toml | grep -v ':[[:space:]]*#'; exit 1; fi
          # Auth guard (mode-aware since #423): AUTH_MODE must render non-empty, and access mode
          # additionally needs the armed Access vars NON-EMPTY (a blank would unarm -> DENY 503).
          grep -Eq 'AUTH_MODE = ".+"' wrangler.toml || { echo "::error::AUTH_MODE empty after render"; exit 1; }
          if [ "$AUTH_MODE" = "access" ]; then
            grep -Eq 'ACCESS_AUD = ".+"' wrangler.toml && grep -Eq 'ACCESS_TEAM_DOMAIN = ".+"' wrangler.toml || { echo "::error::F2 Access vars empty/missing after render"; exit 1; }
          fi
          # #238 follow-up: the R2 S3 endpoint must render to a well-formed account host (an empty
          # account id would leave https://.r2.cloudflarestorage.com and break every presign).
          grep -Eq 'R2_S3_ENDPOINT = "https://[0-9a-f]+\.r2\.cloudflarestorage\.com"' wrangler.toml || { echo "::error::R2_S3_ENDPOINT malformed after render"; exit 1; }
          grep -Eq 'R2_S3_BUCKET = ".+"' wrangler.toml || { echo "::error::R2_S3_BUCKET empty after render"; exit 1; }
          # Opt-in WfP: uncomment the [[dispatch_namespaces]] block ONLY when this account set the
          # ENABLE_WFP_DISPATCH variable to "1" (namespace already created out of band). The committed
          # wrangler.toml.example ships the block COMMENTED, so with the var unset (every community
          # self-host) the render stays commented and deploys free. Fail-closed: if the var is set but
          # the block did not uncomment (example drifted), error rather than deploy a half-config.
          if [ "${ENABLE_WFP_DISPATCH:-}" = "1" ]; then
            sed -i \
              -e 's/^# \(\[\[dispatch_namespaces\]\]\)$/\1/' \
              -e 's/^# \(binding = "MODULE_DISPATCH"\)$/\1/' \
              -e 's/^# \(namespace = "vivijure-modules"\)$/\1/' \
              wrangler.toml
            grep -q '^\[\[dispatch_namespaces\]\]$' wrangler.toml \
              && grep -q '^binding = "MODULE_DISPATCH"$' wrangler.toml \
              && grep -q '^namespace = "vivijure-modules"$' wrangler.toml \
              || { echo "::error::ENABLE_WFP_DISPATCH=1 but dispatch block did not uncomment (example drifted)"; exit 1; }
            echo "WfP dispatch ENABLED for this deploy (MODULE_DISPATCH -> vivijure-modules)."
          fi
          # #238: fill the Secrets Store id for the core [[secrets_store_secrets]] bindings from the
          # SECRETS_STORE_ID repo variable (mirrors the module deploy loop), then fail CLOSED if any
          # placeholder survived -- a core deployed with an unfilled store binding is a self-inflicted outage.
          if [ -z "${SECRETS_STORE_ID:-}" ]; then echo "::error::SECRETS_STORE_ID repo variable is unset -- refusing to deploy the core with unfilled store_id bindings"; exit 1; fi
          sed -i "s/REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID/${SECRETS_STORE_ID}/g" wrangler.toml
          if grep -q "REPLACE_WITH_" wrangler.toml; then echo "::error::core store_id placeholder survived in wrangler.toml"; exit 1; fi
          echo "Rendered wrangler.toml from wrangler.toml.example ($(wc -l < wrangler.toml) lines, F2 vars present)."

      # Apply D1 schema migrations AFTER the wrangler.toml render above (wrangler needs that config
      # to resolve the D1 binding + migrations_dir) and BEFORE the core deploys, so new code never
      # runs against an old schema. Idempotent: wrangler only runs untracked migrations. Additive migrations only; a
      # destructive one would need a manual gate.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply vivijure-studio --remote

      - name: Deploy core worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # Post-deploy gate self-check (S9 W3): PROVE prod is fail-closed. Hit a real /api/* route with
      # NO bearer and REQUIRE 403 -- the deny an unauthenticated caller must get (src/index.ts gates
      # every /api/* before routing). The worker is already LIVE by this step, so this never rolls
      # back a deploy; it turns an accidentally-OPEN studio into a RED CI run instead of a silent
      # ship (the automatic version of the v0.12.0 live matrix). No new secrets: the hostname is the
      # route pattern already in the rendered wrangler.toml. Edge propagation can lag, so a non-403
      # is retried for ~60s. Plain POSIX sh; no bash-isms (cf#809).
      - name: Post-deploy gate self-check
        run: |
          set -eu
          command -v curl >/dev/null 2>&1 || { echo "::error::curl missing on this runner -- cannot run the post-deploy gate self-check"; exit 1; }
          # Derive the hostname from the rendered route pattern; strip a trailing /* if it is a path
          # pattern. A workers.dev / route-less deploy has no pattern -- skip rather than false-alarm.
          HOST="$(grep -oE 'pattern = "[^"]+"' wrangler.toml | head -1 | sed -E 's/^pattern = "([^"]+)"$/\1/' | sed -E 's#/\*?$##')"
          if [ -z "${HOST:-}" ]; then
            echo "::warning::no route pattern in wrangler.toml -- skipping post-deploy gate self-check (workers.dev / no custom domain?)"
            exit 0
          fi
          URL="https://${HOST}/api/modules"
          echo "Proving the gate: no-bearer GET ${URL} must return 403."
          n=0
          code="000"
          while [ "$n" -lt 12 ]; do
            # NO Authorization header on purpose: this is the unauthenticated caller the gate denies.
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" 2>/dev/null || echo 000)"
            if [ "$code" = "403" ]; then
              echo "gate OK: ${URL} -> 403 (fail-closed confirmed)."
              exit 0
            fi
            n=$((n + 1))
            echo "not gated yet (HTTP ${code}); edge may still be propagating -- retry ${n}/12"
            [ "$n" -lt 12 ] && sleep 5
          done
          if [ "$code" = "200" ]; then
            echo "::error::DEPLOY GATE CHECK FAILED -- STUDIO MAY BE OPEN: no-bearer ${URL} returned 200 (the API served an unauthenticated caller). Expected 403. See docs/SECURITY.md."
          else
            echo "::error::post-deploy gate self-check failed: no-bearer ${URL} returned HTTP ${code} (expected 403). See docs/SECURITY.md."
          fi
          exit 1

      # Opt-in, self-host safe edge-cache purge. The core worker is already LIVE by this step, so a
      # failure here NEVER rolls back the deploy -- it just means /welcome may serve stale from the
      # edge until purged. Gated exactly like ENABLE_WFP_DISPATCH: a community
      # self-host sets none of the three values below, so this is a clean no-op (exit 0). Only when a
      # zone id, purge host, and a purge-scoped token (NOT the deploy token) are all set do we purge.
      # Plain POSIX sh, and we grep the JSON rather than take a jq dependency (cf#809).
      - name: Purge Cloudflare edge cache (/welcome)
        env:
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          CF_PURGE_HOST: ${{ vars.CF_PURGE_HOST }}
          CF_CACHE_PURGE_TOKEN: ${{ secrets.CF_CACHE_PURGE_TOKEN }}
        run: |
          if [ -z "${CF_ZONE_ID:-}" ] || [ -z "${CF_PURGE_HOST:-}" ] || [ -z "${CF_CACHE_PURGE_TOKEN:-}" ]; then
            echo "cache purge not configured, skipping"
            exit 0
          fi
          command -v curl >/dev/null 2>&1 || { echo "::error::curl missing on this runner -- cannot purge the edge cache"; exit 1; }
          echo "Purging edge cache for https://${CF_PURGE_HOST}/welcome and https://${CF_PURGE_HOST}/ (zone ${CF_ZONE_ID})"
          CODE="$(curl -s -o /tmp/cf_purge_resp.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"files\":[\"https://${CF_PURGE_HOST}/welcome\",\"https://${CF_PURGE_HOST}/\"]}")" || CODE="000"
          CODE="${CODE:-000}"
          BODY="$(cat /tmp/cf_purge_resp.json 2>/dev/null || true)"
          echo "purge HTTP ${CODE}"
          printf "%s\n" "$BODY"
          if [ "$CODE" -ge 200 ] 2>/dev/null && [ "$CODE" -lt 300 ] 2>/dev/null && printf "%s" "$BODY" | grep -Eq "\"success\"[[:space:]]*:[[:space:]]*true"; then
            echo "Edge cache purged for /welcome and / on ${CF_PURGE_HOST}."
          else
            echo "::error::Cloudflare cache purge failed (HTTP ${CODE}). The worker is LIVE; purge https://${CF_PURGE_HOST}/welcome and https://${CF_PURGE_HOST}/ manually for zone ${CF_ZONE_ID}."
            exit 1
          fi

      # Opt-in Studio MCP Worker deploy (docs/mcp.md). Separate Worker from the studio core
      # (@skyphusion-labs/vivijure-mcp, its own host); agents drive the Studio API through MCP
      # tools. Gated exactly like the WfP / analytics / purge opt-ins: a community self-host sets
      # no-op. Only when BOTH MCP_HOST (the MCP hostname) and MCP_STUDIO_URL (the studio base URL the
      # MCP proxies to) are set do we render wrangler.mcp.toml and deploy. Its two secrets
      # (STUDIO_API_TOKEN, MCP_TOKEN) are seeded ONCE out-of-band (see docs/mcp.md), never in CI --
      # same doctrine as the module secrets, so no secret value passes through GitHub. Plain POSIX
      # sh; no bash-isms (cf#809).
      #
      # cf#328: this job deploys ONLY vivijure-studio-mcp (production). The propagandhi / local
      # door (wrangler.mcp.propagandhi.toml, script vivijure-studio-mcp-flatliners) is INTENTIONAL,
      # hand-deployed, and must NOT share this path -- different STUDIO_URL + fleet secrets CI must
      # not hold. Package/serverInfo drift for both configs is guarded by tests/mcp-doors-328.test.ts;
      # live lag after a pin bump is closed by hand redeploy (docs/mcp.md).
      - name: Deploy Studio MCP Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MCP_HOST: ${{ vars.MCP_HOST }}
          MCP_STUDIO_URL: ${{ vars.MCP_STUDIO_URL }}
        run: |
          set -eu
          if [ -z "${MCP_HOST:-}" ] || [ -z "${MCP_STUDIO_URL:-}" ]; then
            echo "MCP deploy not configured (MCP_HOST / MCP_STUDIO_URL unset), skipping"
            exit 0
          fi
          command -v envsubst >/dev/null 2>&1 || { echo "::error::envsubst (gettext) missing on this runner"; exit 1; }
          export MCP_HOST MCP_STUDIO_URL
          envsubst '$MCP_HOST $MCP_STUDIO_URL' < wrangler.mcp.toml.example > wrangler.mcp.toml
          # fail-closed: no placeholder may survive OUTSIDE comments (a missing var would leave a
          # literal ${...}). Comment lines are excluded: the template's own prose mentions ${...},
          # which envsubst correctly leaves alone (this grep failed every tag deploy at v0.16.2).
          # -F throughout: the pattern '${' is grep-dependent as a regex (busybox matches it
          # literally, GNU treats $ as an anchor and matches NOTHING -> guard silently disarmed).
          if grep -v '^[[:space:]]*#' wrangler.mcp.toml | grep -qF '${'; then echo "::error::unsubstituted placeholder in wrangler.mcp.toml"; grep -nF '${' wrangler.mcp.toml | grep -v ':[[:space:]]*#'; exit 1; fi
          echo "Deploying vivijure-studio-mcp to ${MCP_HOST} (studio ${MCP_STUDIO_URL})..."
          npx wrangler deploy -c wrangler.mcp.toml

  # -----------------------------------------------------------------------------------------------
  # THE TENANT-PROVISIONABLE RELEASE ARTIFACT, GATED BY CONSTRUCTION (cf#562).
  #
  # This was .github/workflows/studio-release.yml carrying its own push: tags: ["v*"] trigger. Same
  # tag, separate file, and needs: cannot cross workflow files -- so it ran in PARALLEL with the four
  # gates below and could publish the artifact every hosted tenant provisions from, and advance the
  # hosted STUDIO_RELEASE pin, while migrations-gate was still deciding. Observed on the v1.27.0 tag:
  # both workflows in_progress at once. Nothing went wrong on that tag, and nothing had determined
  # that it would not.
  #
  # cf#562 listed three options. Querying the check runs for the tag's sha (option 2) is the smallest
  # and the one that can fail OPEN -- an unqueryable check result is not a pass, a rule this estate
  # has now had to restate in three separate files. Copying the gate jobs into the other workflow
  # (option 1) gives the invariant two definitions, which is how cf#560's local-gpu strip came to sit
  # on one render path and not the other. This is option 3: ONE workflow owns everything a v* tag
  # triggers, so needs: works by construction and there is no assertion left to keep true.
  #
  # NO DEADLOCK. ci, container-tests and migrations-gate all run unconditionally on this trigger and
  # assert-on-main carries the same tag-only if: this job does, so every entry in needs: reaches a
  # conclusion rather than waiting on a job that never starts. That is the check to run before
  # widening a needs: array, and it is the same argument the deploy job above makes.
  #
  # NOT a required status check, and it must not become one: it runs only on refs/tags/v*, so on a PR
  # it is skipped, and a required check that never runs blocks every merge. The required contexts on
  # this repo are ci, migrations-gate, coverage and CodeQL.
  studio-release:
    # fc#2250, two additions:
    #
    #   assert-tag-version -- the assert this workflow used to carry only as a step, promoted so it
    #     gates the sibling deploy job too. The step inside studio-release.yml stays: it still guards
    #     the workflow_dispatch path, where GITHUB_REF_NAME is the launch BRANCH rather than the tag,
    #     and that path does not pass through this job at all.
    #
    #   deploy -- the REVERSE direction, and the one nobody had guarded. This job publishes the
    #     artifact every hosted tenant is provisioned from and advances the hosted STUDIO_RELEASE
    #     pin. As siblings, a FAILED deploy did not stop the pin advancing, so tenants provisioned
    #     afterwards were pinned to a release whose Worker never shipped. The pin must never move
    #     ahead of the prod deploy it names.
    #
    # No deadlock: deploy and assert-tag-version are both gated on refs/tags/v*, the same trigger
    # this job runs on, so needs: always resolves rather than waiting on a job that never starts.
    needs: [ci, container-tests, migrations-gate, assert-on-main, assert-tag-version, deploy]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # the called workflow uploads the release asset; nothing else
    concurrency:
      # Moved here with the workflow it guards. A half-published release must never be cancelled.
      group: studio-release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/studio-release.yml
    secrets: inherit
