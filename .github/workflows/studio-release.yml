name: Studio release artifact

# Builds the tenant-studio artifact the hosted provisioner fetches by tag (#59 <-> #53, epic #40).
#
# WHY: "upload the published studio release" had no artifact to upload. The core ships dist/ as
# multi-file compiled TS; a WfP user-Worker upload takes ONE module part; the control plane is a
# Worker and cannot bundle at provision time. This closes that gap, per tag, once.
#
# PUBLIC SOURCE OF TRUTH (parity ruling): the GitHub release asset is authoritative; our R2 is a
# cache/mirror only. An artifact that lives only in our private R2 would leave the AGPL hosted door
# open source but structurally unrunnable by anyone else -- the same "hosted glue that cannot exist
# in self-host" tripwire in a different hat. So the fetch origin is public, and a self-hoster's
# StudioBundleSource config is the same shape as ours.
#
# SECRET-FREE BUILD: the bundle is code; bindings are upload metadata, not baked into the JS. So the
# config is rendered with DUMMY values and the artifact is byte-identical regardless of account.
# Anyone can reproduce it from a clean checkout -- that is the parity property, not a convenience.
#
# vivijure is PUBLIC, so this runs on GitHub-hosted ubuntu-latest (fork-safe), per the runner rule.

# cf#562: THIS WORKFLOW HAS NO TRIGGER OF ITS OWN. It is workflow_call only, invoked by ci.yml's
# studio-release job, which carries needs: [ci, container-tests, migrations-gate, assert-on-main].
#
# It used to fire on push: tags: ["v*"] -- the SAME tag that starts ci.yml -- from a separate file.
# needs: cannot cross workflow files; there is no mechanism for it. So this workflow ran in PARALLEL
# with every gate meant to guard it, and observably did: on the v1.27.0 tag the run list showed
# "Studio release artifact in_progress" beside "CI in_progress". A red migrations-gate could not
# stop it, and what this publishes is the artifact every hosted tenant is provisioned from plus the
# STUDIO_RELEASE pin advance that decides which code hosted tenants run. cf#559 closed exactly that
# door for deploy; this door was never gated, because it is reached through a different one.
#
# WHY A REUSABLE WORKFLOW RATHER THAN COPYING THE GATES IN HERE. Copying ci, container-tests and
# migrations-gate into this file would give the invariant two definitions, which is precisely how
# cf#560's local-gpu strip came to exist on one render path and not the other. Making the release a
# JOB of the workflow that owns the gates makes the ordering STRUCTURAL: needs: resolves inside one
# file or the run does not start. There is then nothing to assert and nothing to keep in sync.
#
# THE workflow_dispatch REBUILD PATH IS GONE WITH THE TRIGGER, deliberately. It was an ungated
# publish door: fc#859 had to bolt an ancestry guard onto this file precisely because that input
# could publish an arbitrary tag pointing at a commit that never merged. Rebuilding a tag's artifact
# is now done by re-running that tag's CI run, which re-runs the gates along with it.
#
# Concurrency moved to the calling job in ci.yml, where the group can still be per-tag and
# cancel-in-progress can still be false. A called workflow does not own its own concurrency here.

on:
  workflow_call:

permissions:
  contents: write # uploads the release asset; nothing else

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # NO ref: (cf#562). workflow_call-only now, so this always checks out the caller's ref --
          # the v* tag whose four gates have just passed. The old inputs.tag || github.ref existed
          # for the workflow_dispatch rebuild path, which is gone with the trigger.
          # Full history so the ancestry guard can walk main to the built commit.
          fetch-depth: 0

      # SECURITY GATE (fc#859): every run of this workflow PUBLISHES (GitHub release + R2 mirror)
      # the artifact built from a tag -- on push OR on a workflow_dispatch whose `tag` input names
      # an existing tag. A tag can point at any commit, including one that never merged, so today it
      # could publish an unreviewed commit as the authoritative studio release that every hosted
      # tenant provisions. This refuses that. UNCONDITIONAL (there is no dry run; every run
      # publishes) and it asserts the CHECKED-OUT commit -- git rev-parse HEAD = the
      # `inputs.tag || github.ref` ref -- NOT $GITHUB_SHA, which on a dispatch is the launch
      # branch, not the tag being built.
      # cf#562 NOTE: the workflow_dispatch door this guard was written for is GONE, and ci.yml's
      # assert-on-main job (now in this job's needs:) asserts the same ancestry. KEPT ANYWAY: it is a
      # security guard on the step that actually publishes, and removing a working control as a
      # side effect of a refactor is how controls go missing. Redundant by construction is the
      # intended state, not a leftover.
      - name: Assert built commit is on main (no release of an unreviewed commit)
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "::error::commit ${head} is not on origin/main; refusing to publish an unreviewed release"
            exit 1
          fi
          echo "commit ${head} is on origin/main; ancestry guard passed."

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # TAG-VS-VERSION GUARD (cf#272). vivijure-control-plane has carried this in deploy.yml
      # preflight since cp#80; vivijure-cf did not, and two tags drifted as a result: v1.12.0 was
      # cut on a tree declaring 1.11.0, and v1.10.1 on a tree declaring 1.10.0. The cp version of
      # this comment says it best -- without the guard you publish a build reporting a version it
      # is not, and every later "which version is live" answer becomes a lie.
      #
      # ADAPTED, not copied. cp keys off GITHUB_REF_NAME because it only ever runs on a tag push.
      # THIS workflow also accepts a `tag` INPUT and checks out `inputs.tag || github.ref`, so on a
      # workflow_dispatch GITHUB_REF_NAME is the launch BRANCH, not the tag being released. Keying
      # off it here would silently skip the guard on exactly the dispatch path that can release an
      # arbitrary tag. It uses the same TAG expression the rest of this file uses.
      #
      # Non-v refs are a NOTICE and pass: this workflow is dispatchable for artifact rebuilds that
      # are not releases, and failing those would make the guard something people route around.
      - name: Tag matches the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "::notice::ref ${TAG} is not a v* tag; the version guard does not apply."; exit 0 ;;
          esac
          want="${TAG#v}"
          pkg="$(node -p "require(\"./package.json\").version")"
          if [ "$want" != "$pkg" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${pkg} -- refusing to publish a mislabelled release"
            exit 1
          fi
          echo "tag ${TAG} matches declared version ${pkg}."


      # Render with DUMMY values on purpose. The bundle is code-only, so none of these reach it; a
      # secret-free render is what makes the artifact reproducible by a third party. The rendered
      # wrangler.toml is gitignored and never leaves the runner.
      - name: Render wrangler.toml (dummy values -- bundle is code-only)
        env:
          AUTH_MODE: token
          ACCESS_TEAM_DOMAIN: ""
          ACCESS_AUD: ""
          D1_DATABASE_ID: "00000000-0000-0000-0000-000000000000"
          VPC_VIDEO_FINISH_ID: "00000000-0000-0000-0000-000000000000"
          VPC_IMAGE_PREP_ID: "00000000-0000-0000-0000-000000000000"
          VPC_AUDIO_BEAT_SYNC_ID: "00000000-0000-0000-0000-000000000000"
          VPC_AUDIO_MIX_ID: "00000000-0000-0000-0000-000000000000"
          SPEND_RATE_LIMITER_NS_ID: "1001"
          SECRETS_STORE_ID: "00000000-0000-0000-0000-000000000000"
          CLOUDFLARE_ACCOUNT_ID: "0000"
          R2_S3_BUCKET: "vivijure"
          R2_S3_ENDPOINT: "https://x.r2.cloudflarestorage.com"
        run: |
          set -euo pipefail
          # cf#560: STRIP THE LOCAL-GPU BLOCK BEFORE RENDERING. This is a HOSTED render -- the
          # artifact every hosted tenant is provisioned from -- and the hosted studio must never bind
          # local-gpu. It has been ruled three times.
          #
          # This path had NO strip and no gate: a bare envsubst, zero occurrences of local-gpu in the
          # whole file, while ci.yml carried a correct and passing refusing gate. That green gate on
          # the other path is exactly why this looked fixed. ci.yml's own comment at the site of the
          # first fix says "The control existed and was on the wrong path"; the fix then reproduced
          # the same shape one path over, which is why the strip is now ONE script both paths call
          # rather than a second copy that can drift or be forgotten.
          #
          # The blast radius here is narrower than on ci.yml and stating it is part of the fix:
          # scripts/build-studio-release.ts reads only compatibility_date, compatibility_flags and
          # the assets block out of this config, and the tenant's real bindings come from the
          # provisioner's WfP upload, so a bound local-gpu here does not reach a tenant's binding set
          # today. It does reach `wrangler deploy --dry-run`, which is what builds the published
          # bundle, and "does not reach a tenant TODAY" is a property of build-studio-release.ts that
          # nothing pins. The invariant is that no hosted studio config binds this door, not that a
          # particular consumer happens to ignore it.
          sh scripts/strip-local-gpu.sh wrangler.toml.example .wrangler.hosted.toml
          envsubst < .wrangler.hosted.toml > wrangler.toml
          rm -f .wrangler.hosted.toml
          sed -i "s/REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID/00000000-0000-0000-0000-000000000000/g" wrangler.toml
          # The tenant studio gets its bindings from the provisioner's upload, not from this file, and
          # a tail_consumers reference to OUR vivijure-tail worker has no meaning in a tenant's
          # namespace. It does not affect the bundled JS either way; stripped so the rendered config
          # cannot mislead anyone reading it as "what a tenant runs".
          sed -i "/^tail_consumers = /d" wrangler.toml

      # The bundle comes from WRANGLER's own bundler against the real config -- not a parallel esbuild
      # that could silently drift from what actually deploys. The artifact IS the deploy shape.
      - name: Bundle the studio worker (wrangler --dry-run)
        run: npx wrangler deploy --dry-run --outdir=bundle-out

      - name: Assemble the release artifact
        id: build
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          node scripts/build-studio-release.ts \
            --bundle bundle-out/index.js \
            --assets public \
            --config wrangler.toml \
            --migrations migrations \
            --tag "$TAG" \
            --out dist-release | tee build.log
          echo "pin=$(cat dist-release/PIN.txt)" >> "$GITHUB_OUTPUT"

      # cf#56: the tenant release module list is resolved ONCE here and carried to every step
      # below through $GITHUB_ENV. It used to be recomputed inline in THREE places (bundle, verify,
      # publish), which is the same drift hazard scripts/finish-satellite-modules.txt already exists
      # to close, one level up: a module added to two of the three lists would build and verify and
      # then never be uploaded to R2, cutting a release whose manifest promises bytes a tenant
      # provision cannot fetch. One list, three consumers.
      #
      # plan-enhance JOINS the set (cf#56). Hosted tenants get the Opus director pass on our own
      # unified billing through the dedicated vivijure-hosted AI Gateway, carrying a per-tenant
      # CF_AIG_TOKEN so that spend is attributable and revocable one tenant at a time. It is NOT a
      # finish satellite, so it is named here rather than added to finish-satellite-modules.txt,
      # which drives a different thing (FINISH_SATELLITES_ONLY in deploy-module-workers.sh).
      - name: Resolve the tenant release module list (single source)
        run: |
          set -euo pipefail
          # cf#394: ONE canonical file, and the composition it replaced is why. This used to be
          # `keyframe own-gpu plan-enhance` inline plus finish-satellite-modules.txt, so "what
          # publishes as a tenant bundle" lived in two places and one of them is named for a
          # different class. Nobody could answer it in a single read, and on 2026-08-03 that cost a
          # lane its direction: the control plane's catalog had grown to EQUAL the publish set with
          # zero headroom and no artifact anywhere said so.
          #
          # Same parse rule as finish-satellite-modules.txt (bare names, blanks skipped) so there is
          # one rule rather than two, and the TS readers of this file need no new logic.
          TENANT_MODULES="$(grep -vE "^[[:space:]]*$" scripts/tenant-release-modules.txt | tr "\n" " ")"
          if [ -z "${TENANT_MODULES// /}" ]; then
            echo "::error::scripts/tenant-release-modules.txt resolved to NOTHING; refusing to publish a release with no tenant modules"
            exit 1
          fi
          echo "TENANT_MODULES=$TENANT_MODULES" >> "$GITHUB_ENV"
          echo "tenant release modules: $TENANT_MODULES"

      # Tenant MODULE workers (cf#99): each is its own wrangler project, so wrangler's own
      # bundler produces the deploy shape and build-module-release.ts assembles + hashes it into
      # the SAME release tree (studio-releases/<tag>/modules/<name>/). A tenant's studio and its
      # modules ship as ONE tag, so they can never be a mismatched pair. Modules hold no assets;
      # their secret bindings are the provisioner's upload metadata, so the bundle is code-only and
      # reproducible (the dummy store ids in each wrangler.toml are inert at --dry-run).
      - name: Bundle + assemble the tenant module workers (cf#99)
        run: |
          set -euo pipefail
          # $TENANT_MODULES is resolved once, in the step above; do NOT recompute it here.
          for m in $TENANT_MODULES; do
            ( cd "modules/$m" && npx wrangler deploy --dry-run --outdir="$GITHUB_WORKSPACE/module-out/$m" )
            node scripts/build-module-release.ts \
              --bundle "module-out/$m/index.js" \
              --config "modules/$m/wrangler.toml" \
              --module "$m" \
              --out "dist-release/modules/$m"
          done

      # A release the provisioner cannot verify is a release we cannot trust. Re-derive the manifest
      # digest from the bytes we are about to publish and fail if it moved.
      - name: Verify the artifact before publishing
        run: |
          set -euo pipefail
          test -s dist-release/worker.js
          test -s dist-release/manifest.json
          node -e "
            const {createHash}=require('node:crypto');
            const {readFileSync,statSync,readdirSync}=require('node:fs');
            const m=JSON.parse(readFileSync('dist-release/manifest.json','utf8'));
            const w=readFileSync('dist-release/worker.js');
            if (createHash('sha256').update(w).digest('hex')!==m.worker.sha256) throw new Error('worker sha256 mismatch');
            if (w.byteLength!==m.worker.size) throw new Error('worker size mismatch');
            for (const a of m.assets) statSync('dist-release/assets/'+a.hash);
            const onDisk=readdirSync('dist-release/assets').length;
            const unique=new Set(m.assets.map(a=>a.hash)).size;
            if (onDisk!==unique) throw new Error('asset count mismatch: '+onDisk+' files vs '+unique+' unique hashes');
            // Migrations + the var contract (cf#85). The control plane verifies these hashes against
            // bytes it did NOT build, so we must not publish a set we have not re-derived ourselves;
            // publishing an unverified schema is how a tenant D1 gets provisioned wrong.
            if (!Array.isArray(m.migrations) || m.migrations.length===0) throw new Error('manifest carries no migrations');
            for (const g of m.migrations) {
              const b=readFileSync('dist-release/migrations/'+g.name);
              if (createHash('sha256').update(b).digest('hex')!==g.sha256) throw new Error('migration sha256 mismatch: '+g.name);
              if (b.byteLength!==g.size) throw new Error('migration size mismatch: '+g.name);
            }
            const migsOnDisk=readdirSync('dist-release/migrations').length;
            if (migsOnDisk!==m.migrations.length) throw new Error('migration count mismatch: '+migsOnDisk+' files vs '+m.migrations.length+' in manifest');
            if (!Array.isArray(m.required_vars) || m.required_vars.length===0) throw new Error('manifest carries no required_vars');
            console.log('artifact verified:', m.assets.length, 'assets,', unique, 'unique,', w.byteLength, 'bytes of worker,', m.migrations.length, 'migrations,', m.required_vars.length, 'required_vars');
          "

      # Same discipline as the studio artifact: re-derive each module worker digest from the bytes
      # about to publish and fail if it moved (a module bundle a tenant cannot verify is one we
      # cannot trust).
      - name: Verify the module artifacts before publishing (cf#99)
        run: |
          set -euo pipefail
          for m in $TENANT_MODULES; do
            test -s "dist-release/modules/$m/worker.js"
            test -s "dist-release/modules/$m/manifest.json"
            node -e "
              const {createHash}=require('node:crypto');
              const {readFileSync}=require('node:fs');
              const man=JSON.parse(readFileSync(process.argv[1],'utf8'));
              const w=readFileSync(process.argv[2]);
              if (man.module!==process.argv[3]) throw new Error('module name mismatch');
              if (createHash('sha256').update(w).digest('hex')!==man.worker.sha256) throw new Error('module worker sha256 mismatch');
              if (w.byteLength!==man.worker.size) throw new Error('module worker size mismatch');
              console.log('module', process.argv[3], 'verified:', w.byteLength, 'bytes');
            " "dist-release/modules/$m/manifest.json" "dist-release/modules/$m/worker.js" "$m"
          done

      - run: tar -czf studio-release-${{ github.ref_name }}.tar.gz -C dist-release .

      # PUBLIC source of truth. Immutability is enforced by the pin ({tag, manifest_sha256}), not
      # trusted: that digest covers the STUDIO artifact only (worker + assets + migrations +
      # required_vars). Module bundles are self-anchored beside the studio tree (cf#147) and may
      # track a different release pin (cf#103). A mutated studio tag fails loud at provision.
      - name: Publish to the GitHub release (public source of truth)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Studio release artifact."
          gh release upload "$TAG" "studio-release-$TAG.tar.gz" "dist-release/manifest.json" --clobber
          echo "::notice title=Studio release pin::$(cat dist-release/PIN.txt)"

      # R2 is a CACHE/MIRROR only, never the source of truth. Skipped entirely when the account
      # secrets are absent, so a fork's build still succeeds and still produces the same artifact.
      - name: Mirror to R2 (cache only; skipped on forks)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_BUCKET: ${{ vars.R2_RELEASES_BUCKET }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          BUCKET="${R2_RELEASES_BUCKET:-vivijure-studio-releases}"
          npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/manifest.json" --file dist-release/manifest.json --remote
          npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/worker.js" --file dist-release/worker.js --remote
          # The tenant D1 schema rides the release (cf#85). Named, not content-addressed: the
          # migration runner tracks each by FILENAME in the tenant schema_migrations table.
          for f in dist-release/migrations/*.sql; do
            npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/migrations/$(basename "$f")" --file "$f" --remote
          done
          for f in dist-release/assets/*; do
            npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/assets/$(basename "$f")" --file "$f" --remote
          done
          for m in $TENANT_MODULES; do
            npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/modules/$m/manifest.json" --file "dist-release/modules/$m/manifest.json" --remote
            npx wrangler r2 object put "$BUCKET/studio-releases/$TAG/modules/$m/worker.js" --file "dist-release/modules/$m/worker.js" --remote
          done

      # ------------------------------------------------------------------------------------------
      # ADVANCE THE HOSTED PIN AS PART OF THE RELEASE, NOT AS A FOLLOW-UP TO IT (cf#372).
      #
      # `STUDIO_RELEASE` on vivijure-control-plane decides which studio code a hosted tenant runs;
      # self-host pulls the tag published above directly. When the pin trails, hosted and self-host
      # run DIFFERENT code from the same nominal tag, against the absolute parity invariant. It has
      # gone stale three times and twice been "fixed" by bumping it, so the advance belongs here.
      #
      # ORDER MATTERS AND THIS IS THE ORDER. Verify the PUBLISHED artifact, then advance. A pin
      # pointed at a tag whose artifact is not pullable is worse than a stale pin: it trades an old
      # studio for a broken provision.
      #
      # This deliberately re-downloads what a SELF-HOSTER would download rather than re-reading the
      # tree this job just built. The two verify steps above already gate the build; a pipeline's
      # opinion of its own output is not evidence that the published artifact is present.
      - name: Re-verify the PUBLISHED artifact before any pin advances
        id: verify_published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v*) ;;
            *) echo "::notice::ref ${TAG} is not a v* tag; nothing to pin."; exit 0 ;;
          esac
          rm -rf published-check && mkdir published-check
          gh release download "$TAG" --dir published-check \
            --pattern "studio-release-$TAG.tar.gz" --pattern "manifest.json"
          test -s "published-check/studio-release-$TAG.tar.gz"
          test -s published-check/manifest.json
          entries="$(tar -tzf "published-check/studio-release-$TAG.tar.gz" | wc -l)"
          if [ "$entries" -lt 1 ]; then
            echo "::error::the published tarball for ${TAG} opened to ZERO entries"
            exit 1
          fi
          # The manifest TAG FIELD, not the filename. A filename is a claim by whoever named it;
          # the manifest is what the provisioner reads and what it refuses on.
          got="$(node -p "JSON.parse(require('node:fs').readFileSync('published-check/manifest.json','utf8')).tag")"
          if [ "$got" != "$TAG" ]; then
            echo "::error::published manifest.json declares tag ${got}, not ${TAG} -- refusing to advance a pin onto it"
            exit 1
          fi
          echo "published artifact for ${TAG} verified: ${entries} entries, manifest tag ${got}."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # ONE DEFINITION: the logic lives in scripts/advance-studio-pin.sh and is driven by
      # tests/advance-studio-pin.test.py, which proves every refusal path against a local server.
      # Inlining a second copy here is what lets the two drift.
      #
      # THIS STEP USED TO WARN AND EXIT 0 WHEN THE SECRET WAS ABSENT, and the comment here argued
      # the trade was worth it because cp#393 backstopped a skip. Both halves failed (cf#372):
      #
      #   - The secret was NEVER PROVISIONED, so the skip was not an edge case, it was every run.
      #     v1.27.0 and v1.28.0 both took this branch, both reported SUCCESS, and neither attempted
      #     a read or a write.
      #   - The warning rendered on both run summaries and was seen by nobody. An annotation is not
      #     a gate: it produces a yellow badge, a zero exit, a green check and no obligation on
      #     anyone. cp#393 fires at the NEXT control-plane deploy, and its drift report is a report
      #     someone must read, so neither half of that backstop is a control on THIS release.
      #
      # Meanwhile the deployed studio reached v1.28.0 while hosted stayed pinned at v1.26.0, so the
      # two doors ran different code under one version number, and the gap grew by one every ship.
      #
      # The skip now applies only to forks and self-host, where the secret legitimately does not
      # exist. On this repository an absent credential FAILS the release.
      - name: Advance the hosted studio pin (vivijure-control-plane)
        if: ${{ steps.verify_published.outputs.verified == 'true' }}
        env:
          STUDIO_PIN_VARIABLE_TOKEN: ${{ secrets.STUDIO_PIN_VARIABLE_TOKEN }}
        run: bash scripts/advance-studio-pin.sh "${{ github.ref_name }}"

      # THE ASSERTION THAT RUNS EVEN WHEN NO WRITE HAPPENED (cf#372).
      #
      # The defect in one sentence: a skip and a success shared exit 0, so a release that never
      # touched the pin was indistinguishable from one that advanced it. Failing closed above fixes
      # the case that bit us; this covers the rest of the class by READING the pin back and judging
      # it against the tag, whatever the step above decided to do.
      #
      # A SEPARATE STEP on purpose. Folded into the advance it would share that exit code, which is
      # the coupling being removed.
      #
      # The invariant is pin NOT BEHIND tag, not pin equals tag: re-running an older tag CI run is
      # the sanctioned rebuild path, the advance correctly declines a backwards move there, and
      # demanding equality would paint that red for doing the right thing. Trailing is the defect,
      # and this is red exactly then.
      - name: Assert the hosted pin is not behind this release
        if: ${{ steps.verify_published.outputs.verified == 'true' }}
        env:
          STUDIO_PIN_VARIABLE_TOKEN: ${{ secrets.STUDIO_PIN_VARIABLE_TOKEN }}
        run: bash scripts/advance-studio-pin.sh "${{ github.ref_name }}" --assert
