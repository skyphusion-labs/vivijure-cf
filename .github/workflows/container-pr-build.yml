name: container-pr-build

# Builds a changed CPU finishing container ON THE PULL REQUEST, without pushing (#759).
#
# WHY THIS EXISTS. `build-media-images.yml` triggers only on `push` to main and on
# `workflow_dispatch`, so a PR that changed a container's dependencies never built that
# container. The review gate for a container pin could not observe whether the pin INSTALLS.
# #673 bumped librosa in containers/audio-beat-sync/requirements.txt, passed thirteen checks,
# merged, and broke main on the first post-merge build: the new version was UNINSTALLABLE on
# that image's base Python. Reverted in #758.
#
# WHY THE EXISTING COVERAGE DOES NOT CLOSE IT, measured rather than assumed. `ci.yml` does run
# `pip install -r containers/video-finish/requirements.txt` on pull_request, so the gate is not
# absent; it covers ONE of the five containers. It is also MIS-CALIBRATED: it resolves on
# `setup-python` 3.12, while the five images are built on python 3.11 (video-finish, image-prep,
# audio-beat-sync) and python 3.14 (audio-mix, audio-master). So the single container it does
# resolve is resolved against an interpreter that no image uses, and a pin whose floor is 3.12
# installs happily there while being uninstallable in the 3.11 image. Only a real build of the
# real base image can answer the question.
#
# WHY NOT JUST DISPATCH build-media-images.yml AGAINST THE PR BRANCH. That workflow is
# `push: true` with tags computed unconditionally as ${IMG}:${SHA} and ${IMG}:latest and no ref
# gate, so dispatching it on a PR branch would publish all five images and overwrite `:latest`
# with unreviewed code. Publishing stays main-only. This job never pushes, which is the entire
# reason it can safely exist.
#
# WHAT ACTUALLY CATCHES THE DEFECT. The Dockerfile warm-up steps, which are ordinary `RUN`
# lines and therefore execute during a `push: false` build. containers/audio-beat-sync/Dockerfile
# imports librosa and JITs the beat tracker; that line fails the build for an uninstallable or
# import-broken pin. The build is the assertion.
on:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/container-pr-build.yml"

permissions:
  contents: read

concurrency:
  group: container-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which containers does this PR actually touch? The matrix is DERIVED, never hand-listed:
  # a hand-listed set is how the existing coverage became one of five, and a list cannot notice
  # a sixth container being added.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      # cf#914: build (a service resolved, the board is meaningful) or skip (only a repo-level
      # file directly under containers/, e.g. compose.yaml, changed -- legitimately nothing to
      # build, NOT a failure). See scripts/discover-changed-containers.sh for the third state
      # (a containers/<x>/ change that maps to no known service), which stays a hard job failure
      # and never reaches this output.
      state: ${{ steps.pick.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # THE CONTROL RUNS FIRST, same shape as tests/lint-python-undefined.test.sh and
      # tests/container-smoke.test.sh elsewhere in this repo: a fix that arrives without a proof
      # it can fail is the same hole in a new shape. This drives scripts/discover-changed-
      # containers.sh against a synthetic containers/ tree and asserts a repo-level-only change
      # (e.g. compose.yaml) reads as skip, a per-service change still builds, and -- the case that
      # must never regress -- a containers/<x>/ change mapping to no known service still refuses.
      - name: Control -- discover-changed-containers distinguishes build/skip and still refuses an unmapped subdirectory (cf#914)
        run: sh tests/discover-changed-containers.test.sh

      # The selection logic itself lives in scripts/discover-changed-containers.sh, not inline
      # here, so the control above can drive it from a workstation. This step is just plumbing:
      # give it the changed paths on stdin, take its stdout contract (state=/count=/matrix=)
      # straight into $GITHUB_OUTPUT.
      - name: Pick the changed containers
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          OUT="$(printf '%s\n' "${CHANGED}" | sh scripts/discover-changed-containers.sh containers .github/workflows/container-pr-build.yml)"
          printf '%s\n' "${OUT}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Name the base image in the log, because the base Python is part of the constraint set for
      # every pin in requirements.txt and it is the fact a reader needs when this job goes red.
      - name: Show the constraint the pins are resolved against
        run: |
          set -eu
          echo "service: ${{ matrix.svc }}"
          grep -m1 '^FROM' "containers/${{ matrix.svc }}/Dockerfile"
          echo "--- requirements.txt"
          cat "containers/${{ matrix.svc }}/requirements.txt" || echo "(no requirements.txt)"

      # push: false is unconditional here and is the reason this job is safe on a PR. Publishing
      # is main-only, in build-media-images.yml. No registry login, no tags, nothing to overwrite.
      # The Dockerfile RUN layers, including the warm-ups that import the changed packages, all
      # execute: that is what makes this a real assertion rather than a syntax check.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.svc }}
          push: false
          provenance: false

  # A matrix that selects nothing produces zero build jobs and a green board, which is the same
  # false-zero shape one level up -- EXCEPT when discover said state=skip (cf#914): a repo-level
  # file directly under containers/ (compose.yaml) changed and no service did, which is legitimately
  # nothing to build, not a failure. That is the one case this job is allowed to read as done
  # without a build having run; every other empty-matrix shape still fails here, unconditionally.
  verify:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A build must actually have run, unless there was legitimately nothing to build
        run: |
          set -eu
          echo "containers selected: ${{ needs.discover.outputs.count }}"
          echo "state: ${{ needs.discover.outputs.state }}"
          echo "discover result: ${{ needs.discover.result }}"
          echo "build result: ${{ needs.build.result }}"
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::discover did not succeed, so no claim is made about any container."
            exit 1
          fi
          if [ "${{ needs.discover.outputs.state }}" = "skip" ]; then
            if [ "${{ needs.discover.outputs.count }}" != "0" ]; then
              echo "::error::state=skip but count is not 0; discover's own output contract is inconsistent, refusing to trust either."
              exit 1
            fi
            # needs.build.result is NOT checked here, deliberately, and this is a measured fact
            # rather than an assumption: on cf#914's own case-2 demo run (PR #918, run
            # 36316476819) an empty JSON-array matrix produced ZERO build job instances, and
            # GitHub Actions reported needs.build.result as failure, not skipped, in the
            # downstream job's context. Gating on it here would fail the exact case this branch
            # exists to let through. state=skip is trustworthy on its own: it comes from the same
            # single script invocation as matrix=[], proven by tests/discover-changed-containers.test.sh,
            # so there is nothing build's result could tell us that state does not already say.
            echo "SKIPPED: only a repo-level containers/ file (e.g. compose.yaml) changed; no service subdirectory did. Nothing to build here, and that is not a failure (cf#914). (needs.build.result reads '${{ needs.build.result }}' here -- expected for an empty matrix, not itself asserted.)"
            exit 0
          fi
          if [ "${{ needs.discover.outputs.count }}" -lt 1 ]; then
            echo "::error::zero containers selected and state is not 'skip'; a green board here would mean nothing was built."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::a container build failed. The base image Python is part of the constraint set for every pin in that container's requirements.txt; read the FROM line in the failing job."
            exit 1
          fi
          echo "OK: ${{ needs.discover.outputs.count }} container(s) built without pushing."
