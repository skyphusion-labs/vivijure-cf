name: container-pr-build

# Builds a changed CPU finishing container ON THE PULL REQUEST, without pushing (#759).
#
# WHY THIS EXISTS. `build-media-images.yml` triggers only on `push` to main and on
# `workflow_dispatch`, so a PR that changed a container's dependencies never built that
# container. The review gate for a container pin could not observe whether the pin INSTALLS.
# #673 bumped librosa in containers/audio-beat-sync/requirements.txt, passed thirteen checks,
# merged, and broke main on the first post-merge build: the new version was UNINSTALLABLE on
# that image's base Python. Reverted in #758.
#
# WHY THE EXISTING COVERAGE DOES NOT CLOSE IT, measured rather than assumed. `ci.yml` does run
# `pip install -r containers/video-finish/requirements.txt` on pull_request, so the gate is not
# absent; it covers ONE of the five containers. It is also MIS-CALIBRATED: it resolves on
# `setup-python` 3.12, while the five images are built on python 3.11 (video-finish, image-prep,
# audio-beat-sync) and python 3.14 (audio-mix, audio-master). So the single container it does
# resolve is resolved against an interpreter that no image uses, and a pin whose floor is 3.12
# installs happily there while being uninstallable in the 3.11 image. Only a real build of the
# real base image can answer the question.
#
# WHY NOT JUST DISPATCH build-media-images.yml AGAINST THE PR BRANCH. That workflow is
# `push: true` with tags computed unconditionally as ${IMG}:${SHA} and ${IMG}:latest and no ref
# gate, so dispatching it on a PR branch would publish all five images and overwrite `:latest`
# with unreviewed code. Publishing stays main-only. This job never pushes, which is the entire
# reason it can safely exist.
#
# WHAT ACTUALLY CATCHES THE DEFECT. The Dockerfile warm-up steps, which are ordinary `RUN`
# lines and therefore execute during a `push: false` build. containers/audio-beat-sync/Dockerfile
# imports librosa and JITs the beat tracker; that line fails the build for an uninstallable or
# import-broken pin. The build is the assertion.
on:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/container-pr-build.yml"

permissions:
  contents: read

concurrency:
  group: container-pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which containers does this PR actually touch? The matrix is DERIVED, never hand-listed:
  # a hand-listed set is how the existing coverage became one of five, and a list cannot notice
  # a sixth container being added.
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick the changed containers
        id: pick
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # THE STRUCTURAL DENOMINATOR. Every container that exists, by glob. If this is empty
          # the tree moved under the workflow (a rename, a reorganisation) and every downstream
          # answer would be a confident zero. An empty glob is the one result this job must never
          # report as a pass, so it is a hard failure, not a skip.
          # Portable on purpose (no `find -printf`, no `mapfile`), so this exact logic can be
          # driven red on a workstation instead of only on the runner.
          ALL=()
          for d in containers/*/; do
            [ -f "${d}Dockerfile" ] || continue
            ALL+=("$(basename "$d")")
          done
          echo "containers discovered: ${#ALL[@]} -> ${ALL[*]:-<none>}"
          if [ "${#ALL[@]}" -eq 0 ]; then
            echo "::error::the containers/*/Dockerfile glob matched ZERO paths. Either the tree moved or this workflow is looking in the wrong place; refusing to report a pass over an empty set."
            exit 1
          fi

          # What this PR changed, three-dot against the merge base so commits that landed on the
          # base branch after the branch point are not attributed to this PR.
          CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
          echo "changed paths:"; echo "${CHANGED}" | sed 's/^/  /'

          SELECTED=()
          for svc in "${ALL[@]}"; do
            if echo "${CHANGED}" | grep -qE "^containers/${svc}/"; then SELECTED+=("${svc}"); fi
          done

          # A change to THIS workflow with no container touched builds everything, so a change to
          # the gate is tested by the gate rather than merged on the claim that it still works.
          if [ "${#SELECTED[@]}" -eq 0 ] && echo "${CHANGED}" | grep -q '^\.github/workflows/container-pr-build\.yml$'; then
            echo "this workflow changed and no container did: building all ${#ALL[@]} as a self-test"
            SELECTED=("${ALL[@]}")
          fi

          # The paths filter fired, so SOMETHING under containers/** or this file changed. An
          # empty selection here means the filter and this mapping disagree, which is exactly the
          # silent-empty-matrix failure this job exists to make loud.
          if [ "${#SELECTED[@]}" -eq 0 ]; then
            echo "::error::the paths filter triggered this workflow but no container matched the changed files. The trigger and the matrix mapping disagree; refusing to pass on an empty matrix."
            exit 1
          fi

          echo "selected: ${#SELECTED[@]} of ${#ALL[@]} -> ${SELECTED[*]}"
          printf 'matrix=%s\n' "$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "${#SELECTED[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        svc: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Name the base image in the log, because the base Python is part of the constraint set for
      # every pin in requirements.txt and it is the fact a reader needs when this job goes red.
      - name: Show the constraint the pins are resolved against
        run: |
          set -eu
          echo "service: ${{ matrix.svc }}"
          grep -m1 '^FROM' "containers/${{ matrix.svc }}/Dockerfile"
          echo "--- requirements.txt"
          cat "containers/${{ matrix.svc }}/requirements.txt" || echo "(no requirements.txt)"

      # push: false is unconditional here and is the reason this job is safe on a PR. Publishing
      # is main-only, in build-media-images.yml. No registry login, no tags, nothing to overwrite.
      # The Dockerfile RUN layers, including the warm-ups that import the changed packages, all
      # execute: that is what makes this a real assertion rather than a syntax check.
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: containers/${{ matrix.svc }}
          push: false
          provenance: false

  # A matrix that selects nothing produces zero build jobs and a green board, which is the same
  # false-zero shape one level up. This job cannot be skipped by an empty matrix, so it is where
  # the count is asserted.
  verify:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A build must actually have run
        run: |
          set -eu
          echo "containers selected: ${{ needs.discover.outputs.count }}"
          echo "discover result: ${{ needs.discover.result }}"
          echo "build result: ${{ needs.build.result }}"
          if [ "${{ needs.discover.result }}" != "success" ]; then
            echo "::error::discover did not succeed, so no claim is made about any container."
            exit 1
          fi
          if [ "${{ needs.discover.outputs.count }}" -lt 1 ]; then
            echo "::error::zero containers selected; a green board here would mean nothing was built."
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::a container build failed. The base image Python is part of the constraint set for every pin in that container's requirements.txt; read the FROM line in the failing job."
            exit 1
          fi
          echo "OK: ${{ needs.discover.outputs.count }} container(s) built without pushing."
