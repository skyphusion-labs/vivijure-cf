# finish-upscale module worker (vivijure-module/2): Real-ESRGAN 2x/4x spatial upscale on the dedicated
# vivijure-upscale RunPod endpoint (CUDA, separate from vivijure-backend). Bound into the core as
# MODULE_UPSCALE; the registry discovers it from GET /module.json.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core. This worker
# holds no R2 creds -- the endpoint reads/writes the shared bucket by key itself.

name = "vivijure-module-finish-upscale"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# cf#279: the durable record of every RunPod job this module submits and polls. RunPod cannot
# enumerate jobs, so an id this worker does not write down is unreachable permanently, and the
# endpoint health counters cannot supply a denominator (they bucket four terminal statuses into two
# and exclude CANCELLED, which this module produces deliberately).
#
# database_id is a PLACEHOLDER in the tracked file and is filled at deploy time (CI:
# scripts/deploy-module-workers.sh; installer: replace_d1_id_placeholder). An unfilled placeholder
# is a dangling binding and wrangler hard-fails on it, which is the intended behaviour: the deploy
# breaks loudly rather than shipping a worker that silently records nothing. The write itself is
# best-effort in code and never fails a render (modules/_shared/runpod-job-log.ts).
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "vivijure-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# RUNPOD_API_KEY + RUNPOD_ENDPOINT_ID are bound from the account-level Cloudflare Secrets Store --
# declarative config that every `wrangler deploy` re-establishes, so a fresh-create can't start
# secretless and silently degrade (the v0.2.2 finish-upscale passthrough bug this fixes). Seeded ONCE
# by the operator from the crew secret store; values never touch CI/GitHub. Set store_id at cutover.
# See docs/DEPLOYMENT.md "Module secrets via the Secrets Store".
[[secrets_store_secrets]]
binding = "RUNPOD_API_KEY"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "RUNPOD_API_KEY"

[[secrets_store_secrets]]
binding = "RUNPOD_ENDPOINT_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "VIDEO_UPSCALE_RUNPOD_ENDPOINT_ID"


# --- OPTIONAL (cf#480): the always-on upscale door on our own GPU iron, reached over a Workers VPC
# --- service. UNSET IS THE NORMAL STATE and deploys unchanged: both blocks below are stripped and
# --- this module uses RunPod exactly as it always has. Set VPC_FINISH_UPSCALE_ID only once the
# --- matching connectivity-directory service exists.
# ---
# --- Both blocks carry the marker `cf482-optional:VPC_FINISH_UPSCALE_ID` so the stripper knows this
# --- binding's full extent. Stripping only the [[vpc_services]] block would leave wrangler
# --- resolving a Secrets Store entry that need not exist -- a half-strip that fails at deploy.
# ---
# --- The module branches on the binding being BOUND, never on RunPod failing
# --- (modules/_shared/finish-door.ts); a failover would silently re-rent the GPU this removes.
[[vpc_services]]
# cf482-optional:VPC_FINISH_UPSCALE_ID
binding = "FINISH_UPSCALE_VPC"
service_id = "REPLACE_WITH_VPC_FINISH_UPSCALE_ID"
remote = true

[[secrets_store_secrets]]
# cf482-optional:VPC_FINISH_UPSCALE_ID
binding = "FINISH_DOOR_TOKEN"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "FINISH_DOOR_TOKEN"

# --- OPTIONAL (cf#507): the SECOND upscale door, on the other GPU box. Same shape, same rules as
# --- the block above, and independently optional: unset is a clean deploy with one door, which is
# --- byte-for-byte the cf#480 behaviour. Set VPC_FINISH_UPSCALE_PROPAGANDHI_ID only once the
# --- matching connectivity-directory service exists.
# ---
# --- Both blocks carry the marker `cf482-optional:VPC_FINISH_UPSCALE_PROPAGANDHI_ID` so the
# --- stripper knows this binding's full extent; a half-strip fails at deploy.
# ---
# --- Its own bearer, rather than sharing the first door's: two doors are two services, and one
# --- token binding that happens to work for both is a coupling nobody declared. Point both at the
# --- same store secret if they do share a bearer -- that is an operator decision, not a schema one.
[[vpc_services]]
# cf482-optional:VPC_FINISH_UPSCALE_PROPAGANDHI_ID
binding = "FINISH_UPSCALE_VPC_PROPAGANDHI"
service_id = "REPLACE_WITH_VPC_FINISH_UPSCALE_PROPAGANDHI_ID"
remote = true

[[secrets_store_secrets]]
# cf482-optional:VPC_FINISH_UPSCALE_PROPAGANDHI_ID
binding = "FINISH_DOOR_TOKEN_PROPAGANDHI"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "FINISH_DOOR_TOKEN_PROPAGANDHI"

[vars]
RUNPOD_WORKERS_MAX = "2"
