# film-titles module worker (vivijure-module/2): opening title + end credit cards on the assembled
# film, via the video-finish CPU container's /film-titles route (VIDEO_FINISH_URL). A film.finish hook
# (#190). Bound into the core as MODULE_FILM_TITLES; the registry discovers it from GET /module.json.
#
# CREDENTIALLESS: the core presigns the film GET + the result PUT and hands them in the invoke input,
# so this module needs no R2 binding and no S3 secret -- it only forwards the spec to the container.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core.

name = "vivijure-module-film-titles"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[vars]
VIDEO_FINISH_URL = "${VIDEO_FINISH_URL}"

# Same store secret as the GPU doors. Unbound is fail-open (vivijure-cf#613).
[[secrets_store_secrets]]
binding = "MEDIA_FINISH_TOKEN"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "FINISH_DOOR_TOKEN"
