# alibaba-wan module worker (vivijure-module/2): Wan 2.6 I2V on RunPod, a motion.backend module
# (#175). Bound into the core as MODULE_ALIBABA_WAN; the registry discovers it from GET /module.json
# and the studio renders the motion.backend stage from it.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core.

name = "vivijure-module-alibaba-wan"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# The rendered clip is stored in the shared render bucket so the core / film assembler can find it.
[[r2_buckets]]
binding = "R2_RENDERS"
bucket_name = "vivijure"

# RUNPOD_API_KEY is bound from the account-level Cloudflare Secrets Store -- declarative config that
# every `wrangler deploy` re-establishes, so a fresh-create can't start secretless and silently
# degrade (the v0.2.2 finish-upscale passthrough bug). Seeded ONCE by the operator from the crew
# secret store; values never touch CI/GitHub. Set store_id to the real id at cutover.
# See docs/DEPLOYMENT.md "Module secrets via the Secrets Store".
[[secrets_store_secrets]]
binding = "RUNPOD_API_KEY"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "RUNPOD_API_KEY"

# cf#305: the studio D1 as TELEMETRY_DB, so this cost-door submitter writes a runpod_job_log row.
# Before this the entire cost door wrote NO row at all, so a census of the table showed the six
# tenant modules and simply did not mention these eight -- a module that never writes cannot appear
# in a count built from what was written. database_id is filled by scripts/deploy-module-workers.sh
# from the D1_DATABASE_ID secret (generic across modules/*/wrangler.toml, no script change), and
# that script refuses to deploy if the placeholder survives.
#
# REVISIT THIS BINDING IF cp#284 IS ANSWERED "TENANTS GET THE COST DOOR". `vivijure-studio` is the
# FIRST-PARTY studio D1. Binding it here is correct TODAY only because these eight scripts live in
# our own namespace and a hosted tenant cannot reach them at all: cp#284 measured zero occurrences
# of all eight cost-door module names in the control plane (with `keyframe` at 28 through the same
# matcher as the positive control), and TENANT_MODULE_CATALOG is six entries, none of them these.
# So every row this binding writes is our own traffic.
#
# If that decision goes the other way and these modules are installed into the tenant dispatch
# namespace, this same binding becomes a CROSS-TENANT WRITE into the first-party telemetry table,
# not a missing row. That failure is silent and it fails in the worse direction: the table keeps
# filling, the counts keep looking healthy, and tenant job ids sit in an operator-facing table they
# do not belong in. The tenant modules would need their own telemetry destination decided WITH that
# ruling, not after it.
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "vivijure-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
