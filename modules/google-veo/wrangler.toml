# google-veo module worker (vivijure-module/2): Google Veo 3.1 Fast I2V on RunPod, a
# motion.backend module (#172). Bound into the core as MODULE_GOOGLE_VEO; the registry discovers
# it from GET /module.json and the studio renders the motion.backend stage from it.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core.

name = "vivijure-module-google-veo"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# The rendered clip is stored in the shared render bucket so the core / film assembler can find it.
[[r2_buckets]]
binding = "R2_RENDERS"
bucket_name = "vivijure"

# RUNPOD_API_KEY is bound from the account-level Cloudflare Secrets Store -- declarative config that
# every `wrangler deploy` re-establishes, so a fresh-create can't start secretless and silently
# degrade (the v0.2.2 finish-upscale passthrough bug). Seeded ONCE by the operator from the crew
# secret store; values never touch CI/GitHub. Set store_id to the real id at cutover.
# See docs/DEPLOYMENT.md "Module secrets via the Secrets Store".
[[secrets_store_secrets]]
binding = "RUNPOD_API_KEY"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "RUNPOD_API_KEY"

# cf#305: the studio D1 as TELEMETRY_DB, so this cost-door submitter writes a runpod_job_log row.
# Before this the entire cost door wrote NO row at all, so a census of the table showed the six
# tenant modules and simply did not mention these eight -- a module that never writes cannot appear
# in a count built from what was written. database_id is filled by scripts/deploy-module-workers.sh
# from the D1_DATABASE_ID secret (generic across modules/*/wrangler.toml, no script change), and
# that script refuses to deploy if the placeholder survives.
#
# cp#284 IS ANSWERED AND THE ANSWER WAS "TENANTS GET THE COST DOOR" (cp#317). This block used to
# say TENANT_MODULE_CATALOG was six entries with none of these eight in it, and that a hosted tenant
# therefore could not reach this worker at all. Both halves are false now. Measured 2026-09-27
# against vivijure-control-plane@main src/tenant-modules.ts, read by the array BOUNDS rather than by
# grepping `module:`: the catalog is 17 entries and eight of them are the cost door.
#
# THE CROSS-TENANT WRITE THE OLD BLOCK PREDICTED DOES NOT HAPPEN, and that is worth stating here
# because the binding below still names the FIRST-PARTY D1. A tenant never runs these bytes with
# these bindings. scripts/build-module-release.ts publishes a module bundle whose manifest carries
# {module, worker.sha256, compatibility_date, compatibility_flags} and no bindings at all, and the
# plane supplies the entire binding set itself at upload: R2_RENDERS to the TENANT bucket
# (`type: "r2_bucket" ... bucket_name: tenantBucketName`, which THROWS rather than falling back to
# the operator bucket) and TELEMETRY_DB to the TENANT D1 (`type: "d1" ... id: telemetryD1Id`, which
# THROWS on a null). So database_name below governs OUR OWN deploy only, through
# scripts/deploy-module-workers.sh.
#
# WHAT WOULD STILL BREAK IT, stated so it is not re-derived from scratch: a change that lets a
# module own wrangler.toml bindings reach a tenant namespace, or a plane change that binds
# TELEMETRY_DB to anything other than tenants.d1_database_id. Either one turns this line into the
# cross-tenant write silently, with every count still looking healthy.
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "vivijure-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
