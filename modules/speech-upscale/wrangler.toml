# speech-upscale module worker (vivijure-module/2): dialogue SPEECH enhancement (resemble-enhance) on
# the dedicated vivijure-audio-upscale RunPod endpoint (CUDA). Bound into the core as
# MODULE_SPEECH_UPSCALE; the registry discovers it from GET /module.json.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core. This worker
# holds no R2 creds -- the endpoint reads/writes the shared bucket by key itself.

name = "vivijure-module-speech-upscale"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

# cf#279: the durable record of every RunPod job this module submits and polls. RunPod cannot
# enumerate jobs, so an id this worker does not write down is unreachable permanently, and the
# endpoint health counters cannot supply a denominator (they bucket four terminal statuses into two
# and exclude CANCELLED, which this module produces deliberately).
#
# database_id is a PLACEHOLDER in the tracked file and is filled at deploy time (CI:
# scripts/deploy-module-workers.sh; installer: replace_d1_id_placeholder). An unfilled placeholder
# is a dangling binding and wrangler hard-fails on it, which is the intended behaviour: the deploy
# breaks loudly rather than shipping a worker that silently records nothing. The write itself is
# best-effort in code and never fails a render (modules/_shared/runpod-job-log.ts).
[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "vivijure-studio"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# RUNPOD_API_KEY + RUNPOD_ENDPOINT_ID are bound from the account-level Cloudflare Secrets Store --
# declarative config that every `wrangler deploy` re-establishes, so a fresh-create can't start
# secretless and silently degrade into "no-runpod-secrets" passthrough (#238, the same class as the
# v0.2.2 finish-upscale bug #237 fixed). Seeded ONCE by the operator; values never touch CI/GitHub.
# RUNPOD_ENDPOINT_ID resolves to the dedicated vivijure-audio-upscale endpoint (store secret
# AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID); RUNPOD_API_KEY is the shared store secret. store_id is filled at
# deploy (ci.yml / deploy.sh). See docs/DEPLOYMENT.md "Module secrets via the Secrets Store".
[[secrets_store_secrets]]
binding = "RUNPOD_API_KEY"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "RUNPOD_API_KEY"

[[secrets_store_secrets]]
binding = "RUNPOD_ENDPOINT_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID"

[vars]
RUNPOD_WORKERS_MAX = "2"
# Comma-separated HTTPS origins. Empty = no door (RunPod path). First URL is the legacy door.
SPEECH_UPSCALE_DOORS = "${SPEECH_UPSCALE_DOORS}"

# Door bearers. Origins are SPEECH_UPSCALE_DOORS (empty = RunPod path).
[[secrets_store_secrets]]
binding = "SPEECH_DOOR_TOKEN"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "SPEECH_DOOR_TOKEN"

[[secrets_store_secrets]]
binding = "SPEECH_DOOR_TOKEN_PROPAGANDHI"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "SPEECH_DOOR_TOKEN_PROPAGANDHI"
