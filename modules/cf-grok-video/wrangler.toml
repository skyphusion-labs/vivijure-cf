# cf-grok-video: Cloudflare AI Gateway i2v motion.backend (xai/grok-imagine-video).
# ASYNC via Workflow (CF env.AI.run is sync-only; #155). Bound as MODULE_CF_GROK_VIDEO.
# account_id from CLOUDFLARE_ACCOUNT_ID (env), never hardcoded.

name = "vivijure-module-cf-grok-video"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2_RENDERS"
bucket_name = "vivijure"

[[workflows]]
name = "cf-grok-video-i2v"
binding = "I2V_WORKFLOW"
class_name = "CfGrokVideoWorkflow"

[[secrets_store_secrets]]
binding = "GATEWAY_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "GATEWAY_ID"

# ZDR: xAI PUTs the mp4 to a presigned R2 URL. Same store secrets as the host.
[[secrets_store_secrets]]
binding = "R2_S3_ACCESS_KEY_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "R2_S3_ACCESS_KEY_ID"

[[secrets_store_secrets]]
binding = "R2_S3_SECRET_ACCESS_KEY"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "R2_S3_SECRET_ACCESS_KEY"

[vars]
R2_S3_ENDPOINT = "${R2_S3_ENDPOINT}"
R2_S3_BUCKET = "${R2_S3_BUCKET}"
