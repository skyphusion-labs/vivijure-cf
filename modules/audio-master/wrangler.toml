# audio-master module worker (vivijure-module/2): film-level audio mastering -- music upscale (soxr 48k
# + air lift) + LUFS loudness normalization -- via the always-on audio-master CPU container on the fleet
# over AUDIO_MASTER_URL (CPU ffmpeg, no GPU; GPU money is for GPU work only). Bound into the core as
# MODULE_AUDIO_MASTER; the registry discovers it from GET /module.json.
#
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core. CREDENTIALLESS:
# the core presigns the bed GET + the mastered PUT; this worker holds no R2 creds.

name = "vivijure-module-audio-master"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[vars]
# Public HTTPS origin. Empty = not configured (honest degrade). Filled at deploy.
AUDIO_MASTER_URL = "${AUDIO_MASTER_URL}"

[[secrets_store_secrets]]
binding = "MEDIA_FINISH_TOKEN"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "FINISH_DOOR_TOKEN"
