# cf-vidu-q3-turbo: Cloudflare AI Gateway motion.backend (vidu/q3-turbo).
# ASYNC via Workflow (CF env.AI.run is sync-only; #155). Bound as MODULE_CF_VIDU_Q3_TURBO.
# account_id from CLOUDFLARE_ACCOUNT_ID (env), never hardcoded.

name = "vivijure-module-cf-vidu-q3-turbo"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2_RENDERS"
bucket_name = "vivijure"

[[workflows]]
name = "cf-vidu-q3-turbo-i2v"
binding = "I2V_WORKFLOW"
class_name = "CfViduQ3TurboWorkflow"

[[secrets_store_secrets]]
binding = "GATEWAY_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "GATEWAY_ID"
