# cf-hh1-r2v: Cloudflare AI Gateway i2v motion.backend (alibaba/hh1.1-r2v).
# ASYNC via Workflow (CF env.AI.run is sync-only; #155). Bound as MODULE_CF_HH1_R2V.
# account_id from CLOUDFLARE_ACCOUNT_ID (env), never hardcoded.

name = "vivijure-module-cf-hh1-r2v"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[ai]
binding = "AI"

[[r2_buckets]]
binding = "R2_RENDERS"
bucket_name = "vivijure"

[[workflows]]
name = "cf-hh1-r2v-i2v"
binding = "I2V_WORKFLOW"
class_name = "CfHh1R2vWorkflow"

[[secrets_store_secrets]]
binding = "GATEWAY_ID"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "GATEWAY_ID"
