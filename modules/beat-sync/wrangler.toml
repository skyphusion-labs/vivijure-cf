# beat-sync module worker (vivijure-module/2): librosa beat analysis via the always-on
# audio-beat-sync container (AUDIO_BEAT_SYNC_URL). Bound as MODULE_BEAT_SYNC.
# account_id is read from CLOUDFLARE_ACCOUNT_ID (env), not hardcoded, same as the core.

name = "vivijure-module-beat-sync"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[vars]
# Public HTTPS origin. Empty = not configured (hard fail at invoke). Filled at deploy.
AUDIO_BEAT_SYNC_URL = "${AUDIO_BEAT_SYNC_URL}"

[[secrets_store_secrets]]
binding = "MEDIA_FINISH_TOKEN"
store_id = "REPLACE_WITH_VIVIJURE_SECRETS_STORE_ID"
secret_name = "FINISH_DOOR_TOKEN"
