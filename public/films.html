<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Films -- Vivijure Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0E1730">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="planner-body filmmaker-surface" data-studio-page="films">
  <header class="topbar">
    <a class="brand brand-vivijure" href="planner" aria-label="Vivijure studio">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Vivijure</span>
    </a>
    <nav class="studio-nav" data-studio-nav aria-label="Studio pages"></nav>
    <span class="topbar-spacer"></span>
    <div class="account">
      <button id="account-toggle" type="button" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account &amp; tools">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
      <div id="account-menu" class="account-menu" role="menu" hidden>
        <button id="account-user" class="account-row account-user" type="button" role="menuitem" title="signed in">
          <span class="account-ico"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
          <span class="account-email" id="account-email">loading&#8230;</span>
        </button>
        <div class="account-prefs" role="group" aria-label="Preferences">
          <div class="account-prefs-head">Preferences</div>
        </div>
      </div>
    </div>
  </header>
  <main class="planner-layout films-layout">
    <section id="films-home" class="planner-stage">
      <h1>Films</h1>
      <p class="lede">Long films, built as parts and joined at the end.</p>
      <div id="films-all-wrap" hidden>
        <h2 class="planner-stage-title">all films</h2>
        <p id="films-all-empty" class="films-muted" hidden>No films on this studio yet.</p>
        <ul id="films-all" class="films-recent"></ul>
      </div>
      <div id="films-recent-wrap">
        <h2 class="planner-stage-title">recent on this device</h2>
        <p id="films-recent-empty" class="films-muted">No films opened on this device yet.</p>
        <ul id="films-recent" class="films-recent"></ul>
      </div>
      <form id="films-open" class="films-open">
        <label class="planner-field">
          <span>open a film by id</span>
          <input id="films-open-id" class="planner-input" type="text" autocomplete="off" spellcheck="false" />
        </label>
        <button type="submit" class="planner-secondary">Open</button>
      </form>
    </section>

    <p id="film-load-note" class="films-note" role="status"></p>

    <div id="film-detail" hidden>
      <section class="planner-stage">
        <p><a href="films">All films</a></p>
        <div class="films-part-head">
          <h1 id="film-title"></h1>
          <span id="film-phase" class="films-chip"></span>
        </div>
        <progress id="film-bar" class="films-bar" value="0" max="1"></progress>
        <div id="film-shots"></div>
        <div id="film-elapsed" class="films-muted"></div>
        <div id="film-cost" class="films-muted"></div>
        <div id="film-stop" class="films-stop" role="alert" hidden>
          <strong id="film-stop-reason"></strong>
          <div id="film-stop-note"></div>
        </div>
        <div class="films-actions"><button id="film-resume" type="button" class="planner-primary" hidden></button></div>
        <div id="film-spend" class="films-muted"></div>
        <div id="film-basis" class="films-muted"></div>
        <form id="film-ceiling" class="films-open" hidden>
          <label class="planner-field">
            <span>raise the spend ceiling, in dollars</span>
            <input id="film-ceiling-input" class="planner-input" type="number" inputmode="decimal" step="any" min="0" />
          </label>
          <button type="submit" class="planner-secondary">Raise</button>
        </form>
        <div id="film-degraded" class="films-degraded" hidden></div>
        <div id="film-error" class="films-error" role="alert" hidden></div>
      </section>

      <section id="film-output" class="planner-stage" hidden></section>

      <section class="planner-stage">
        <div class="films-part-head">
          <h2 class="planner-stage-title">parts</h2>
          <label class="films-muted"><input id="film-only-trouble" type="checkbox" /> only failed or rendering</label>
        </div>
        <div id="film-parts-count" class="films-muted"></div>
        <ul id="film-parts" class="films-parts"></ul>
      </section>
    </div>

    <dialog id="film-retry-dialog" class="planner-spend-confirm">
      <form method="dialog">
        <h3 id="film-retry-title"></h3>
        <p id="film-retry-body"></p>
        <p id="film-retry-note" class="films-error"></p>
        <div class="planner-actions">
          <button type="submit" value="cancel" class="planner-secondary">Go back</button>
          <button id="film-retry-go" type="submit" value="go" class="planner-primary">Retry</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="auth-token.js"></script>
  <script src="module-registry.js"></script>
  <script src="poll-schedule.js"></script>
  <script src="studio-chrome.js"></script>
  <script src="topbar.js"></script>
  <script src="films.js"></script>
</body>
</html>
